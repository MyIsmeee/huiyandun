# 单域关联（物理域）：画面冻结或重放即生成关联事件，不必先有网络告警（FR-303）
# 篡改画面的攻击者可能不经认证爆破（如已知口令、物理接入）：先有网络告警时另由 HYD-X-0001 升为 critical。
# 关联事件自动触发存证；没有攻击源，不触发封禁。severity 取 medium、不交 AI 值班员研判：重放是视觉模型
# 判定，现场实测（桌面平拍的手机画面）3 小时内误报约 43 次，校准前不升为高等级事件
# 样本：rules/tests/HYD-VIS-0002/sequences.yaml
id: HYD-VIS-0002
version: 1.1.0
name: 画面遭冻结或重放
mode: enforce
window_s: 60
group_by: device_id
sequence:
  - subject: hyd.vision.integrity.v1
    match: { type: [freeze, replay] }
emit:
  severity: medium
  title: 摄像头画面遭冻结或重放
  techniques: [T0832]  # Manipulation of View（ICS）
