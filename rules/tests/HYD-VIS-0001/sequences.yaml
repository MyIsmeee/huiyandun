# 关联规则样本（C-SEC-01）：按列表顺序送入引擎（即到达顺序），t 为事件发生时刻（秒）
# 未写的字段由测试补默认值：告警为 enforce、rule 来源的 auth_bruteforce，画面事件为 rule 来源的 freeze
cases:
  - name: 镜头被遮挡
    events:
      - { t: 0, subject: hyd.vision.integrity.v1, camera_id: cam-01, type: occlusion, source: model }
    incidents: [{ requires_confirmation: true }]

  - name: 镜头被挪位
    events:
      - { t: 0, subject: hyd.vision.integrity.v1, camera_id: cam-01, type: shift, source: model }
    incidents: [{ requires_confirmation: true }]

  - name: 断流不是遮挡（设备离线另行显示）
    events:
      - { t: 0, subject: hyd.vision.integrity.v1, camera_id: cam-01, type: stream_lost }
    incidents: []

  - name: 网络告警不命中
    events:
      - { t: 0, subject: hyd.security.alert.v1, device_id: cam-01 }
    incidents: []

  - name: 遮挡持续时不重复生成，停止 5 分钟后再次出现才算新事件
    events:
      - { t: 0, subject: hyd.vision.integrity.v1, camera_id: cam-01, type: occlusion, source: model }
      - { t: 30, subject: hyd.vision.integrity.v1, camera_id: cam-01, type: shift, source: model }
      - { t: 400, subject: hyd.vision.integrity.v1, camera_id: cam-01, type: occlusion, source: model }
    incidents: [{ requires_confirmation: true }, { requires_confirmation: true }]
