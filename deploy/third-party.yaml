# 外部检测规则（C-RU-05、R-06）：快照存于 rules/vendor/，随 suricata 镜像打包，运行时不下载（G-05）
# 上游 rules.emergingthreats.net 每日更新且不保留历史版本：更新时替换快照与本条目，重跑 make test-rules
rulesets:
  - name: ET Open（open-nogpl）
    version: "11320"  # 上游 version.txt
    file: rules/vendor/et-open/emerging-all.rules.tar.gz
    sha256: 212bc2f7c27c0f372a66e77eb2f86335ecb4c93c1c46714393cfcf495503286b
    license: BSD-3-Clause  # 只含 ET 自有规则（sid 2000000～2799999），不含 GPL 规则；许可证文本同目录
    purpose: Suricata 签名规则：扫描、爆破、常见利用（01 §6.1）
    owner: MyIsmeee

  - name: MITRE ATT&CK 精简查表（Enterprise、ICS）
    version: "20.0"
    file: rules/attack/techniques.json
    sha256: d72d4703a5c067a583e9a1e9952b577c5849b8654976066a601556987501fb3a
    # ATT&CK 使用条款：允许复制与再分发，须保留 MITRE 版权声明与署名（01 REUSE-11）
    license: LicenseRef-MITRE-ATTACK-Terms-of-Use
    # 由 tools/dev/attack_table.py 从 MITRE attack-stix-data 仓库 v20.0 的 STIX 数据抽取（D-070）
    purpose: 技术编号 → 名称、战术：关联事件的战术阶段、值班员查表（HYD-PLAN-007 §1）
    owner: MyIsmeee

# Python 包自带的二进制库（wheel 内 *.libs/）：随 wheel 分发、进程内动态链接、未经修改（G-08）
# 版本取自 wheel 内的 SBOM、库的 soname 与版本接口；所属包升级时须重新核对
bundled:
  - package: opencv-python-headless==5.0.0.93
    owner: MyIsmeee
    libraries:
      # 构建配置不含 --enable-gpl / --enable-nonfree（avutil_license 返回 LGPL version 2.1 or later）
      - { name: FFmpeg（libavcodec、libavformat、libavutil、libswresample、libswscale）, version: 8.1.1, license: LGPL-2.1-or-later }
      - { name: libgfortran, version: 8.5.0, license: GPL-3.0-or-later WITH GCC-exception-3.1 }
      - { name: libquadmath, version: 8.5.0, license: LGPL-2.1-or-later }
      # 已停止维护，镜像加固时替换（#71）
      - { name: OpenSSL（libssl、libcrypto）, version: 1.1.1k, license: OpenSSL }
      - { name: libpng, version: 1.6.58, license: libpng-2.0 }
      - { name: libaom, version: 3.14.1, license: BSD-2-Clause }
      - { name: libavif, version: 1.4.2, license: BSD-2-Clause }
      - { name: libvpx, version: 1.15.2, license: BSD-3-Clause }
      - { name: OpenBLAS, version: 0.3.15, license: BSD-3-Clause }
      - { name: libdrm, version: 2.4.115, license: MIT }
  - package: numpy==2.5.4
    owner: MyIsmeee
    libraries:
      - { name: OpenBLAS（scipy-openblas64）, version: 0.3.34, license: BSD-3-Clause }
      - { name: libgfortran, version: 8.5.0, license: GPL-3.0-or-later WITH GCC-exception-3.1 }
      - { name: libquadmath, version: 8.5.0, license: LGPL-2.1-or-later }
  # supervision 的依赖（REUSE-07）
  - package: scipy==1.18.1
    owner: MyIsmeee
    libraries:
      - { name: OpenBLAS（scipy-openblas32）, version: 0.3.31.dev, license: BSD-3-Clause }
      # 两份构建：8.5.0 来自 wheel 的 SBOM；另一份随 OpenBLAS，其构建工具链为 GCC 10.2.1
      - { name: libgfortran, version: 8.5.0 / 10.2.1, license: GPL-3.0-or-later WITH GCC-exception-3.1 }
      - { name: libquadmath, version: 8.5.0 / 10.2.1, license: LGPL-2.1-or-later }
  # supervision 的依赖（REUSE-07），无法去掉。版本取自 wheel 内 SBOM 与 PIL.features
  # libimagequant（GPL-3.0）虽列于 SBOM，但未编入（features.check_feature("libimagequant") 为 False）；
  # FriBiDi（LGPL-2.1）不随 wheel 分发，仅在系统已安装时动态加载
  - package: pillow==13.0.0
    owner: MyIsmeee
    libraries:
      - { name: FreeType, version: 2.14.3, license: FTL }  # FTL 与 GPL-2.0 双许可，选用 FTL
      - { name: HarfBuzz, version: 14.5.0, license: MIT }
      - { name: raqm（静态编入）, version: 0.11.0, license: MIT }
      - { name: libjpeg-turbo, version: 3.2.0, license: IJG AND BSD-3-Clause }
      - { name: libtiff, version: 4.7.2, license: libtiff }
      - { name: libpng, version: 1.6.58, license: libpng-2.0 }
      - { name: libwebp（含 sharpyuv、webpmux、webpdemux）, version: 1.6.0, license: BSD-3-Clause }
      - { name: libavif, version: 1.4.2, license: BSD-2-Clause }
      - { name: OpenJPEG, version: 2.5.4, license: BSD-2-Clause }
      - { name: Little CMS 2, version: 2.19.1, license: MIT }
      - { name: zlib-ng, version: 2.3.3, license: Zlib }
      - { name: Brotli, version: 1.2.0, license: MIT }
      - { name: xz（liblzma）, version: 5.8.4, license: 0BSD }
      - { name: Zstandard, version: 1.5.7, license: BSD-3-Clause }  # BSD-3-Clause 与 GPL-2.0 双许可，选用 BSD
      - { name: libxcb, version: 1.17.0, license: X11 }
      - { name: libXau, version: 1.0.9, license: X11 }

