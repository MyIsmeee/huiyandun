# 全部服务定义（HYD-DEP-005 §3.1）；镜像与 deploy/third-party.yaml 一致（C-RU-01）
# 自研服务由仓库根目录构建，基础镜像同样登记；标签 hyd.oneshot 的服务执行完即退出，以退出码 0 视为就绪
name: huiyandun

services:
  postgres:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    profiles: [core]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: hyd
    # 应用账号口令供 postgres-init 创建 hyd_app、hyd_audit
    secrets: [postgres_password, db_app_password, db_audit_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [core-net]
    healthcheck:
      # 走 TCP：首次初始化期间的临时实例只监听 socket，不应被判为就绪
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    profiles: [core]
    # 不使用镜像自带配置：其中含集群示例口令
    command: ["nats-server", "--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - natsdata:/data
    networks: [core-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 以属主账号执行迁移后退出；常驻服务只持有应用账号口令，无法停用审计表触发器（G-13）
  migrate:
    image: huiyandun/api-server:local
    build: { context: ../.., dockerfile: services/api-server/Dockerfile }
    profiles: [core]
    command: ["hyd-api", "migrate"]
    labels: { hyd.oneshot: "true" }
    environment:
      HYD_DB_USER: postgres
      HYD_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [core-net]

  api-server:
    image: huiyandun/api-server:local
    build: { context: ../.., dockerfile: services/api-server/Dockerfile }
    profiles: [core]
    # 后两者分别加密供应商 API Key 与摄像头口令（C-ST-03、D-101）
    # push_password 只用于新增推流摄像头时显示一次（V-CAM2）
    secrets: [db_app_password, llm_key_secret, device_key_secret, push_password]
    volumes:
      - ../../demo/scenarios/site.yaml:/etc/hyd/site.yaml:ro  # 站点配置（FR-901）
      # 值班员只读工具（TK-116）：会话日志、行为模型基线（TK-115）与 ATT&CK 精简表
      - zeek-logs:/zeek/logs:ro
      - correlator-state:/var/lib/correlator:ro
      - ../../rules/attack/techniques.json:/etc/hyd/attack.json:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }  # 订阅事件转发到 WS 各频道
    networks:  # 经 llm-net 调 llm-gateway 的内部接口
      core-net: {}
      video-net: { ipv4_address: 172.30.11.4 }  # 固定地址：ingest 的控制接口只放行它（D-117）
      llm-net: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-service:
    image: huiyandun/audit-service:local
    build: { context: ../.., dockerfile: services/audit-service/Dockerfile }
    profiles: [core]
    secrets: [db_audit_password]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [core-net]
    healthcheck:
      # 校验全部封存记录：审计日志被篡改时转为 unhealthy
      test: ["CMD", "hyd-audit", "verify"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      start_interval: 2s

  # LLM 接入网关（HYD-ARCH-001 §5）：唯一访问模型供应商的组件（C-LLM-01）。内部接口只经 llm-net 给
  # api-server；不接入 core-net，其他服务无法借它出网。经 llm-egress 访问使用方配置的供应商地址（DP-05 例外）
  llm-gateway:
    image: huiyandun/llm-gateway:local
    build: { context: ../.., dockerfile: services/llm-gateway/Dockerfile }
    profiles: [core]
    extra_hosts: ["host.docker.internal:host-gateway"]  # 供应商在宿主上时填此名（DP-07）
    networks: [llm-net, llm-egress]
    volumes:
      - ../configs/llm-tasks.yaml:/etc/hyd/llm-tasks.yaml:ro
      - ../../rules/attack/techniques.json:/etc/hyd/attack.json:ro  # 事实回溯的本地知识库（C-LLM-06）
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 关联引擎（HYD-ARCH-001 §6）：归一化 suricata 的 EVE 告警，发布 hyd.security.alert.v1（TK-032）；
  # 设备行为模型读 zeek 的 conn.log（TK-115）。探针日志来自解析不可信流量的进程，只读挂载、按模型校验；
  # 读取位置与行为模型状态存于持久卷，重启后续用
  correlator:
    image: huiyandun/correlator:local
    build: { context: ../.., dockerfile: services/correlator/Dockerfile }
    profiles: [core]
    volumes:
      - suricata-logs:/var/log/suricata:ro
      - zeek-logs:/zeek/logs:ro
      - correlator-state:/var/lib/correlator
      - ../../rules/correlator:/etc/hyd/rules:ro  # 关联规则（HYD-PLAN-007 §4）
      - ../../rules/attack/techniques.json:/etc/hyd/attack.json:ro  # ATT&CK 精简查表（D-070）
      # 由 nvr-sim 正常流量学好的基线快照：没有存盘状态时加载
      - ../../demo/scenarios/behavior-baseline.json:/etc/hyd/behavior-baseline.json:ro
    environment:
      HYD_BEHAVIOR_BASELINE_FILE: /etc/hyd/behavior-baseline.json
    depends_on: { nats: { condition: service_healthy } }
    networks: [core-net]
    restart: unless-stopped  # 进程退出后自动拉起：告警归一化与关联不因一次错误停止
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      # 主循环每 0.5 s 更新心跳文件；10 s 未更新视为卡死
      test: ["CMD", "python3", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/hyd-correlator-alive') > 10)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # 确定性处置（TK-050、G-03）：关联事件 → Playbook → 经 privileged-helper 的签名指令封禁；不 import 任何 LLM 客户端
  playbook-executor:
    image: huiyandun/playbook-executor:local
    build: { context: ../.., dockerfile: services/playbook-executor/Dockerfile }
    profiles: [core]
    secrets: [executor_signing_key]
    volumes:
      - helper-run:/run/hyd-helper
      - ../../demo/scenarios/site.yaml:/etc/hyd/site.yaml:ro  # 部署模式与核心业务白名单（C-SEC-03）
      - ../../playbooks:/etc/hyd/playbooks:ro
    depends_on:
      nats: { condition: service_healthy }
      correlator: { condition: service_healthy }  # 关联事件的流由 correlator 创建
      privileged-helper: { condition: service_healthy }
    networks: [core-net]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      # 事件循环每秒更新心跳文件；10 s 未更新视为卡死
      test: ["CMD", "python3", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/hyd-playbook-alive') > 10)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # 特权动作（C-SEC-06、D-074）：宿主网络加 NET_ADMIN 操作内核防火墙，封禁作用于宿主转发路径；
  # 不接入任何容器网络，只经与 playbook-executor 共享的卷中的套接字接受签名指令（DP-05 例外）
  privileged-helper:
    image: huiyandun/privileged-helper:local
    build: { context: ../.., dockerfile: services/privileged-helper/Dockerfile }
    profiles: [core]
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    secrets: [helper_public_key]
    volumes:
      - helper-run:/run/hyd-helper
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys; sys.exit(not os.path.exists('/run/hyd-helper/helper.sock'))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # 存证唯一写入方（D-04、G-07，TK-080）：关联事件产生时写入命中事件、关联事件与 recorder 截取的录像；
  # 内部接口只供 api-server 导出证据包。存证卷只有本服务挂载，签名私钥只给本服务（G-14）
  evidence-service:
    image: huiyandun/evidence-service:local
    build: { context: ../.., dockerfile: services/evidence-service/Dockerfile }
    profiles: [core]
    secrets: [evidence_signing_key]
    volumes:
      - evidence-data:/var/lib/hyd-evidence
    depends_on: { nats: { condition: service_healthy } }
    # recorder 的配置接口只放行此固定地址（D-101）
    networks:
      core-net: {}
      evidence-net: { ipv4_address: 172.30.9.10 }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # 唯一对外入口（C-OPS-05）：前端页面与 /api、/ws 同源反向代理，配置见 Caddyfile
  web-console:
    image: huiyandun/web-console:local
    build: { context: ../.., dockerfile: web/console/Dockerfile }
    profiles: [core]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data  # 本地 CA：重建容器后浏览器已导入的根证书仍有效
    ports: ["443:8443"]
    depends_on: { api-server: { condition: service_healthy } }
    networks: [core-net, edge-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 流接入（REUSE-03）：摄像头只被拉流一次，检测与浏览器都经 go2rtc 取流（C-CV-10）
  go2rtc:
    image: alexxit/go2rtc:1.9.15@sha256:e098de5c2f8040dc3d4784ed2d5cfdac3b0979f9349afe587ef6a670a14b9f4d
    profiles: [vision]
    # 流由 api-server 按摄像头登记表经 API 增删（D-101）；go2rtc 每次增删都写回配置文件，
    # 故启动时把只读的基础配置复制到容器内的临时目录再运行，重启后由 api-server 补齐
    volumes: ["./go2rtc.yaml:/base/go2rtc.yaml:ro"]
    tmpfs: [/config]
    command: ["sh", "-c", "cp /base/go2rtc.yaml /config/go2rtc.yaml && exec go2rtc -config /config/go2rtc.yaml"]
    # 只开放 WebRTC 媒体端口（C-OPS-05、D-02）。API（1984）无鉴权且可新建 exec 源：
    # 不接入 core-net，只经 video-net 供 api-server 转发信令、经 demo-net 供 vision-engine 取流；
    # API 与 RTSP 只监听这两个网络的固定地址（go2rtc.yaml），宿主经 edge-net、camera-net 访问不到（#97）
    ports: ["8555:8555/tcp", "8555:8555/udp"]
    # camera-net：拉取摄像头登记表中的局域网摄像头（D-103，G-05 例外）；ingest-net：从 ingest 取推流
    networks:
      video-net: { ipv4_address: 172.30.11.2 }
      demo-net: { ipv4_address: 172.30.12.2 }
      edge-net: {}
      camera-net: {}
      ingest-net: { ipv4_address: 172.30.10.2 }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://172.30.11.2:1984/api"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 推流接收（TK-129、D-103）：复用 MediaMTX（REUSE-04）。设备推到边缘主机 8554 端口，须带推流口令；
  # 只有 go2rtc 可从这里读取。推流口令只给本服务与 api-server（G-14）
  ingest:
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    profiles: [vision]
    secrets: [push_password]
    entrypoint:
      - sh
      - -c
      - sed "s|__PUSH_PASS__|$$(cat /run/secrets/push_password)|" /base/ingest.yml > /tmp/ingest.yml && exec /mediamtx /tmp/ingest.yml
    volumes: ["./ingest.yml:/base/ingest.yml:ro"]
    ports: ["8554:8554/tcp"]
    # video-net：控制接口只监听此固定地址、只放行 api-server（兼容模式中继路径，D-117）；
    # camera-net：兼容模式下代为拉取登记表中的摄像头（D-103、D-117，G-05 例外）
    networks:
      edge-net: {}
      ingest-net: { ipv4_address: 172.30.10.10 }
      video-net: { ipv4_address: 172.30.11.3 }
      camera-net: {}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://172.30.11.3:9997/v3/paths/list"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 视觉引擎（HYD-ARCH-001 §8）：经 go2rtc 拉流检测，向 NATS 发布 track 与 scene 事件。启动时断言推理设备（C-CV-11）
  # 模型权重由 make fetch-models 下载（R-03）。只接入内部网络：onnxruntime 遥测已关闭，网络再隔一层（G-05）
  vision-engine:
    image: huiyandun/vision-engine:local
    build: { context: ../.., dockerfile: services/vision-engine/Dockerfile }
    profiles: [vision]
    environment:
      HYD_DEVICE: cpu  # 显式 CPU 模式（DP-06）；compose.gpu.yaml 改为 cuda
      HYD_MODEL_FILE: /models/rtmo-s_body7-640x640.onnx
      HYD_VEHICLE_MODEL_FILE: /models/rfdetr_s_v142_512x512.onnx
      HYD_SCENE_MODEL_FILE: /models/efficientvit_seg_l1_ade20k_512.onnx
      HYD_INTEGRITY_MODEL_FILE: /models/dinov2_small.onnx
    volumes:
      - ../../models/weights:/models:ro  # 摄像头来自登记表 hyd.config.cameras.v1，不读 site.yaml（D-101）
    depends_on:
      nats: { condition: service_healthy }
      go2rtc: { condition: service_healthy }
    networks: [core-net, demo-net]
    # 进程退出后自动拉起：单路异常在进程内重试；任一路停滞时进程主动退出（#79）
    restart: unless-stopped
    healthcheck:
      # 全部检测与场景循环、读帧线程都在 10 s 内有进展时每秒更新心跳文件（#79）
      test: ["CMD", "python3", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/hyd-vision-alive') > 10)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # 持续录像（TK-080、D-098）：复用 MediaMTX（REUSE-04）从 go2rtc 拉流（摄像头仍只被拉一次，C-CV-10），
  # 环形保留 20 分钟；只开回放接口，只在 evidence-net 供 evidence-service 截取告警前后的片段
  recorder:
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    profiles: [vision]
    volumes:
      - ./recorder.yml:/mediamtx.yml:ro
      - recordings:/recordings
    depends_on: { go2rtc: { condition: service_healthy } }
    networks: [demo-net, evidence-net]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      # 已登记的路径都在录像（已从 go2rtc 取到流）才算就绪；路径由 evidence-service 按登记表下发，尚无路径时也算就绪
      test: ["CMD-SHELL", "s=$$(wget -qO- http://127.0.0.1:9997/v3/paths/list) && case $$s in *'\"ready\":false'*) exit 1 ;; *) exit 0 ;; esac"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 网络探针隔离（C-SEC-08，参照 Malcolm、Security Onion 的加固并进一步隔离）：探针解析不可信流量，
  # 被攻破时不能成为横向移动的跳板。capture-tap 把抓包源的流量单向镜像进 tap-net，探针只接入 tap-net：
  # 网络里没有其他服务，到不了被监测的网络与宿主。capture-tap 需要宿主网络与 NET_ADMIN 配置网卡（DP-05 例外），
  # 执行一次即退出，不处理流量。抓包源默认 attack-net 网桥（演示中 attack-sim→rtsp-target 的 RTSP
  # 爆破在此发生）；真实部署以 HYD_CAPTURE_IFACE 指定接交换机镜像端口、未配置 IP 的网卡
  capture-tap:
    image: huiyandun/capture-tap:local
    build: { context: ../.., dockerfile: agents/sensor/capture-tap/Dockerfile }
    profiles: [security]
    network_mode: host
    command: ["${HYD_CAPTURE_IFACE:-hyd-attack}", "hyd-tap"]
    labels: { hyd.oneshot: "true" }
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]

  # 网络入侵检测（REUSE-08）：IDS 模式，不阻断；不监听端口、不持有口令，结果只写日志卷
  suricata:
    image: huiyandun/suricata:local
    build: { context: ../.., dockerfile: agents/sensor/suricata/Dockerfile }
    profiles: [security]
    # 不经镜像入口脚本（它会 chown 配置目录）。以 root 打开抓包与日志后切换为 suricata 用户，
    # 只保留 NET_RAW、NET_ADMIN、SYS_NICE 并清空能力边界集；NET_ADMIN 只作用于探针自己的网络命名空间
    entrypoint: ["suricata"]
    command: ["--user", "suricata", "--group", "suricata", "--include", "/etc/suricata/hyd.yaml",
      "-i", "eth0", "-k", "none"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN, SYS_NICE, SETUID, SETGID, SETPCAP, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/var/run/suricata:uid=998,gid=998"]  # 控制套接字，供健康检查
    volumes:
      - suricata-logs:/var/log/suricata  # EVE 告警日志
      - suricata-cache:/var/lib/suricata  # 规则编译缓存：重启后数秒内恢复检测，不必重新编译全部规则
    depends_on: { capture-tap: { condition: service_completed_successfully } }
    networks: [tap-net]
    healthcheck:
      test: ["CMD", "suricatasc", "-c", "uptime"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s  # 首次启动编译全部 ET Open 规则
      start_interval: 5s

  # 网络会话元数据（REUSE-08）：JSON 日志。以 zeek 用户运行，抓包能力以文件能力授予（见 Dockerfile），
  # 因此不设 no-new-privileges
  zeek:
    image: huiyandun/zeek:local
    build: { context: ../.., dockerfile: agents/sensor/zeek/Dockerfile }
    profiles: [security]
    command: ["-C", "-i", "af_packet::eth0", "local", "LogAscii::use_json=T"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    tmpfs: [/tmp]
    volumes: ["zeek-logs:/zeek/logs"]
    depends_on: { capture-tap: { condition: service_completed_successfully } }
    networks: [tap-net]
    healthcheck:
      test: ["CMD", "pgrep", "-x", "zeek"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 无真实摄像头时循环推流演示素材（REUSE-04）；素材由 make demo-media 生成
  mediamtx:
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    profiles: [demo]
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ../../demo/media:/media:ro
    networks: [demo-net]
    healthcheck:
      # 全部路径都已有推流才算就绪：素材缺失时 ffmpeg 反复退出，路径保持未就绪
      test: ["CMD-SHELL", "s=$$(wget -qO- http://127.0.0.1:9997/v3/paths/list) && case $$s in *'\"ready\":false'*) exit 1 ;; *'\"ready\":true'*) exit 0 ;; *) exit 1 ;; esac"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 自建 RTSP 测试目标（DP-09、C-SEC-11）：复用 mediamtx（REUSE-04），读取需鉴权、对每次尝试回 401。
  # 取用 site.yaml 中被攻击摄像头 cam-02 的 IP，使网络告警可映射到该设备（FR-203）
  rtsp-target:
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    profiles: [demo]
    volumes: ["./rtsp-target.yml:/mediamtx.yml:ro"]
    networks:
      attack-net:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9997/v3/config/global/get"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 受控攻击模拟（DP-09、C-SEC-11）：只对 rtsp-target 发 RTSP 认证重试，触发 HYD-NET-0001。
  # 一次性执行后退出（红方命令 make attack、make attack-slow 启动，D-105）；只接入 attack-net，网络层只够得到
  # rtsp-target，碰不到 go2rtc 等。源地址在白名单（172.30.0.0/28）之外，后续处置才能真正封禁它。
  # 行为参数登记于 demo/scenarios/attack-sim.yaml
  attack-sim:
    image: huiyandun/attack-sim:local
    build: { context: ../.., dockerfile: agents/sim/attack-sim/Dockerfile }
    profiles: [demo]
    # 只由队员执行 make attack / attack-slow 时运行（compose run），demo-up 不启动（D-105）
    scale: 0
    labels: { hyd.oneshot: "true" }
    environment:
      HYD_TARGET: rtsp-target
      HYD_TARGET_PORT: "8554"
      HYD_RTSP_PATH: cam
      HYD_USER: admin
      HYD_PASSWORD: wrong-password
      HYD_ATTEMPTS: "6"
      HYD_INTERVAL_S: "0"  # 低速模式由 make attack-slow 改为 20（每分钟 3 次）
    depends_on: { rtsp-target: { condition: service_healthy } }
    networks:
      attack-net:
        ipv4_address: 172.30.0.100
    read_only: true
    cap_drop: [ALL]

  # 合法录像机（TK-115、FR-205）：每 15 s 向 rtsp-target 拉流 5 s，形成设备行为基线。rtsp-target 按来源地址
  # 放行它，不用口令（G-14）；地址在白名单（172.30.0.0/28）内，不会被封禁。复用 mediamtx 镜像中的 ffmpeg，
  # 不监听任何端口，attack-sim 在网络层够得到它也无从下手
  nvr-sim:
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    profiles: [demo]
    entrypoint:
      - sh
      - -c
      - >-
        while :; do ffmpeg -hide_banner -loglevel error -rtsp_transport tcp
        -i rtsp://rtsp-target:8554/cam -t 5 -c copy -f null - && touch /tmp/pulled; sleep 10; done
    user: "65534:65534"
    depends_on: { rtsp-target: { condition: service_healthy } }
    networks:
      attack-net:
        ipv4_address: 172.30.0.13
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      # 最近 1 分钟内成功拉过流
      test: ["CMD-SHELL", "find /tmp/pulled -mmin -1 | grep -q ."]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  # 内部网络不给宿主分配网关地址（gateway_mode_ipv4: isolated）：宿主上的进程访问不到其中的服务
  core-net:
    internal: true
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: isolated }
  # 演示视频源与流接入；不连接宿主机外部网络（DP-04、DP-05）。同时是演示的抓包源：固定网桥名供 capture-tap 使用
  demo-net:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: hyd-demo
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:  # 固定网段供 go2rtc 的 RTSP 只监听本网络地址（#97）；自动分配的地址避开固定地址，否则先启动的容器会占用它
      config:
        - subnet: 172.30.12.0/24
          ip_range: 172.30.12.128/25
  # api-server 经此转发 WebRTC 信令到 go2rtc；go2rtc 不接入 core-net，碰不到数据库与事件总线。
  # 固定网段供 go2rtc 的 API 只监听本网络地址（#97）
  video-net:
    internal: true
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: isolated }
    ipam:
      config:
        - subnet: 172.30.11.0/24
          ip_range: 172.30.11.128/25
  # 探针网络：只有探针，只接收 capture-tap 镜像进来的流量；探针之间也不互通
  tap-net:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: hyd-tap
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.enable_icc: "false"
  # 受控攻击网络（DP-09、C-SEC-11）：只有 attack-sim 与 rtsp-target；attack-sim 在网络层只够得到
  # rtsp-target，碰不到 go2rtc 等。演示抓包源即此网桥，RTSP 爆破在此被探针观测。固定网桥名供 capture-tap 使用
  attack-net:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: hyd-attack
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # 存证网络：只有 recorder 与 evidence-service，回放接口不暴露给其他服务；固定网段供 recorder 按地址放行配置接口
  evidence-net:
    internal: true
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: isolated }
    ipam:
      config:
        - subnet: 172.30.9.0/24
          ip_range: 172.30.9.128/25
  # 开放端口的服务所在网络（DP-05 例外）：端口映射需要非 internal 网络；关闭 IP 伪装，容器无法出站（G-05）
  edge-net:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # 拉取局域网摄像头的出站网络（D-103、D-117）：只有 go2rtc 与兼容模式中继 ingest 接入，只拉登记表中的地址
  camera-net: {}
  # go2rtc 从 ingest 取设备推来的流；固定网段供 ingest 按地址只放行 go2rtc 读取
  ingest-net:
    internal: true
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: isolated }
    ipam:
      config:
        - subnet: 172.30.10.0/24
  # api-server 经此调用 llm-gateway 的内部接口；只有这两个服务接入
  llm-net:
    internal: true
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: isolated }
  # llm-gateway 访问供应商的出站网络（DP-05 例外）：只有 llm-gateway 接入
  llm-egress: {}

volumes:
  pgdata:
  natsdata:
  caddydata:
  suricata-logs:
  suricata-cache:
  correlator-state:
  zeek-logs:
  evidence-data:  # 存证（G-07），只有 evidence-service 挂载
  recordings:  # recorder 的 20 分钟环形录像，不是存证
  helper-run:  # privileged-helper 的套接字，只与 playbook-executor 共享

# 口令由 make demo-up 首次运行时生成，不入库（G-14）
secrets:
  postgres_password:
    file: .secrets/postgres_password
  db_app_password:
    file: .secrets/db_app_password
  db_audit_password:
    file: .secrets/db_audit_password
  # playbook-executor 的签名私钥与 privileged-helper 的公钥（D-074）
  executor_signing_key:
    file: .secrets/executor_signing_key
  helper_public_key:
    file: .secrets/helper_public_key
  llm_key_secret:
    file: .secrets/llm_key_secret
  device_key_secret:
    file: .secrets/device_key_secret
  # 设备向 ingest 推流的口令（D-103）
  push_password:
    file: .secrets/push_password
  # evidence-service 的存证签名私钥（D-098）
  evidence_signing_key:
    file: .secrets/evidence_signing_key
