# 持续录像（TK-080、D-098）：从 go2rtc 拉各路流写 fMP4 分段，环形保留 20 分钟，供 evidence-service 截取
# 告警前后的原始码流（C-EVD-02）。路径由 evidence-service 按摄像头登记表经配置接口增删，路径名即摄像头编号（D-101）
logLevel: info

# 只开回放与配置接口；配置接口只允许本机健康检查与 evidence-service（固定地址）；不提供 RTSP 等任何取流服务
api: true
apiAddress: :9997
playback: true
playbackAddress: :9996
rtsp: false
rtmp: false
hls: false
webrtc: false
srt: false
moq: false

# 回放接口只在 evidence-net（只有本服务与 evidence-service）
authInternalUsers:
  - user: any
    ips: ["127.0.0.1", "::1", "172.30.9.10"]  # 172.30.9.10 为 evidence-service 在 evidence-net 的固定地址
    permissions: [{ action: api }]
  - user: any
    permissions: [{ action: playback }]

pathDefaults:
  rtspTransport: tcp
  record: true
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f%z
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s
  recordDeleteAfter: 20m
