# 流接入（REUSE-03、C-CV-10）：每路只拉流一次，分发给检测与浏览器；流名与 site.yaml 的 stream 一致
# 接入真实摄像头时只改 streams（HYD-DEP-005 §6）
api:
  listen: ":1984"
rtsp:
  listen: ":8554"
webrtc:
  listen: ":8555"
  ice_servers: []  # 清空 go2rtc 默认的公网 STUN 服务器，运行时不访问外部地址（G-05），不得删除
  # 浏览器经宿主机映射的 8555 取媒体流（C-OPS-05）；容器 IP 在宿主机之外不可达，须公布本机地址。
  # 演示在本机浏览器访问；WSL 只把 Windows 的 127.0.0.1 TCP 转发进来，浏览器实际走 TCP 候选
  candidates:
    - 127.0.0.1:8555

streams:
  cam-01: rtsp://mediamtx:8554/cam-01
  cam-02: rtsp://mediamtx:8554/cam-02
