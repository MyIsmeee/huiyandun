# GPU 覆盖文件（ops.md §2）：make demo-up 默认加载，GPU=0 时不加载（DP-06）
# 经 NVIDIA Container Toolkit 透传 GPU（C-HW-10）；CUDAExecutionProvider 未生效时 vision-engine 退出（C-CV-11）
services:
  vision-engine:
    environment:
      HYD_DEVICE: cuda
      # 默认 2048 MiB 由 4 个模型平分，3 路摄像头时 RF-DETR 的 512 MiB 不够，显存耗尽后 CUDA 上下文损坏、全部检测停摆
      HYD_GPU_MEM_LIMIT_MB: "5120"
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
