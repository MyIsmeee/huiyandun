[project]
name = "evidence-service"
version = "0.0.0"
description = "存证：哈希链、逐条 Ed25519 签名、视频片段截取、证据包导出（01 §7、C-EVD-01～04）"
requires-python = "==3.12.*"
dependencies = [
    "cryptography>=50,<51",  # 与 playbook-executor 一致；SHA-256、Ed25519（REUSE-16）
    "fastapi>=0.162.0,<0.163",
    "httpx2>=2.16.0,<3",  # 向 recorder 取录像
    "nats-py>=2.16.0,<2.17",  # 与 py-common 一致；捕获订阅失败的异常类型
    "py-common",
    "py-contracts",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
hyd-evidence-service = "evidence_service.service:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
py-common = { workspace = true }
py-contracts = { workspace = true }
