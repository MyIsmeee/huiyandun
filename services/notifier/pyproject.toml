[project]
name = "notifier"
version = "0.0.0"
description = "告警通知：确认级物理告警与关联事件推送到企业微信、钉钉群机器人或通用 Webhook（可选部署，compose.notify.yaml）"
requires-python = "==3.12.*"
dependencies = [
    "httpx2>=2.16.0,<3",  # 与 evidence-service 一致
    "nats-py>=2.16.0,<2.17",  # 与 py-common 一致；捕获订阅失败的异常类型
    "py-common",
    "py-contracts",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
hyd-notifier = "notifier.service:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
py-common = { workspace = true }
py-contracts = { workspace = true }
