[project]
name = "correlator"
version = "0.0.0"
description = "关联引擎：归一化 Suricata 告警，跨域关联生成 Incident（HYD-ARCH-001 §6）"
requires-python = "==3.12.*"
dependencies = [
    "nats-py>=2.16.0,<2.17",  # 与 py-common 一致；捕获发布失败的异常类型
    "py-common",
    "py-contracts",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
hyd-correlator = "correlator.service:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
py-common = { workspace = true }
py-contracts = { workspace = true }
