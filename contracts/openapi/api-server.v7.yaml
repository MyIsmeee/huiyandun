# api-server 对外接口（architecture.md §12、C-BE-01）
# 主版本编码在文件名中；破坏性变更须升主版本并改文件名（CI-08）
# v5：站点去掉平面图墙体、门洞与 zones，改为场景区域（D-124、TK-152）
# v6：摄像头接入方式增加 usb、行为事件增加 still 与 fight（响应中的枚举新增值，D-138）
# v7：摄像头接入方式增加 file，即视频文件摄像头（响应中的枚举新增值，D-145）
# x-min-role：最低角色（C-BE-07）；写操作要求 X-Request-ID（C-BE-08）
# 会话凭证只经 HttpOnly Cookie 传递，浏览器脚本不可读（C-FE-06、DP-12）
openapi: 3.1.0
info:
  title: 慧眼盾 api-server
  version: 7.0.0
security:
  - session: []

paths:
  /api/auth/login:
    post:
      operationId: login
      security: []
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: hyd_session=<会话令牌>; HttpOnly; Secure; SameSite=Strict; Path=/
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/logout:
    post:
      operationId: logout
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "204": { description: 会话已失效，Cookie 已清除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/session:
    get:
      operationId: getSession
      description: 当前会话的账户与角色：页面刷新后据此决定渲染哪些操作（C-FE-07）
      x-min-role: viewer
      responses:
        "200":
          description: 会话有效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/site:
    get:
      operationId: getSite
      x-min-role: viewer
      responses:
        "200":
          description: 站点、场景区域、设备、标定状态（FR-901、FR-908）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/scene/areas:
    get:
      operationId: listSceneAreas
      x-min-role: viewer
      responses:
        "200":
          description: 全部场景区域及其物体，按编号排列
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneAreaList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSceneArea
      description: 新建空区域；写审计（G-13），经 WS site 频道推送
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneAreaCreate" }
      responses:
        "201":
          description: 已新建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneArea" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/scene/areas/{id}:
    put:
      operationId: saveSceneArea
      description: |
        整体保存区域：名称、尺寸、物体与本区域摄像头的位置和朝向（FR-908）。cameras 即保存后位于本区域的全部摄像头：
        未列出的原有摄像头移出区域，列出的其他区域摄像头移入（其原区域的 updated_at 随之更新）。
        摄像头的位置与朝向写回登记表，各服务按 FR-906 热更新。物体与摄像头的放置点须在区域内，否则返回 400（D-125）。
        在摄像头页改位置、朝向或删除摄像头同样更新所在区域的 updated_at。写审计（G-13），经 WS site 频道推送
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneAreaUpdate" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneArea" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: updated_at 与库中不一致：场景已被其他人修改
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteSceneArea
      description: 写审计（G-13），经 WS site 频道推送
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "204": { description: 已删除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 区域内仍有摄像头
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/scene/areas/{id}/frames:
    get:
      operationId: getSceneAreaFrames
      description: |
        对区域内摄像头的当前画面各识别一次环境，供场景页"从画面生成初稿"（FR-909、D-133）：只含平面坐标，
        不含图像（C-LLM-04）。只读、不改动区域；草稿由场景页转换，经管理员确认后随整体保存提交
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 识别帧与没有识别结果的摄像头及原因
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneAreaFrames" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: 识别服务未响应
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/scene/areas/{id}/auto:
    get:
      operationId: getSceneAreaAuto
      description: |
        场景自动识别的最近结果：api-server 后台每 10 分钟对每个区域识别一次（只缓存在内存中）。区域没有手工搭建的
        物体时，态势页按它显示场景。尚未识别过时 frames 为空
      x-min-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 识别帧与没有识别结果的摄像头及原因
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneAreaFrames" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/cameras/usb-devices:
    get:
      operationId: listUsbDevices
      description: |
        插在边缘主机上的 USB 摄像头（只列视频采集节点），供新增摄像头时选择接入；已接入的标出摄像头编号。
        拔插后重新读取即可看到变化，不需要重启
      x-min-role: admin
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsbDeviceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/cameras/video-files:
    post:
      operationId: uploadVideoFile
      description: |
        上传视频文件摄像头的视频（D-145、FR-914）：请求体为文件原始字节，单个不超过 2 GiB。暂存于边缘主机，10 分钟内未被
        摄像头引用即删除，api-server 重启时全部删除。上传本身不写审计，被摄像头引用时随 camera.created / camera.updated 记入
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - name: name
          in: query
          required: true
          description: 浏览器给出的原始文件名，只用于显示；去掉路径部分，超过 200 字截断
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: 已暂存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "411":
          description: 缺少 Content-Length
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: 视频超过 2 GiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507":
          description: 边缘主机磁盘空间不足：写入后剩余空间须不少于 2 GiB（录像与数据库同盘）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/cameras:
    get:
      operationId: listCameras
      description: 摄像头登记表（FR-905、D-101）；口令只返回是否已设置
      x-min-role: admin
      responses:
        "200":
          description: 全部摄像头，按编号排列
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createCamera
      description: 新增摄像头；保存后同步 go2rtc 并发布 hyd.config.cameras.v1，各服务热更新（FR-906）
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraCreate" }
      responses:
        "201":
          description: 已新增
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 设备 IP 已被其他摄像头使用，或已达 16 路上限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/cameras/{id}:
    patch:
      operationId: updateCamera
      description: 只修改给出的字段；口令省略表示不修改，clear_password 为 true 时清除；calibration 只经标定接口修改，改安装参数不影响标定（D-134）
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 设备 IP 已被其他摄像头使用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteCamera
      description: 删除后实时识别与录像停止，告警历史保留
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "204": { description: 已删除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/cameras/{id}/snapshot:
    get:
      operationId: getCameraSnapshot
      description: 经 go2rtc 取一帧 JPEG 供编辑框预览、画警戒线（V-CAM4、V-CAM7）与摄像头栏缩略图（D-115），不落盘；viewer 本就可经 WebRTC 观看同一路画面
      x-min-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 一帧画面
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: 取不到画面，message 为白话原因
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/cameras/{id}/calibration/check:
    post:
      operationId: checkCameraCalibration
      description: 按标定点拟合地面映射，只返回误差、不保存，供标定对话框实时显示（V-CAM10、FR-910）；拟合由 vision-engine 应答（D-132）
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalibrationInput" }
      responses:
        "200":
          description: 拟合结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalibrationFit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CalibrationAreaChanged" }
        "503": { $ref: "#/components/responses/CalibrationUnavailable" }
  /api/cameras/{id}/calibration:
    put:
      operationId: saveCameraCalibration
      description: 拟合通过后保存标定、写审计并下发登记表，视觉引擎按新标定运行（FR-906、FR-910）；points 为空表示清除标定，回到按安装参数估算（D-102）
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalibrationInput" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CalibrationAreaChanged" }
        "503": { $ref: "#/components/responses/CalibrationUnavailable" }
  /api/devices/{id}:
    get:
      operationId: getDevice
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 设备详情（FR-203）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/devices/{id}/webrtc:
    post:
      operationId: webrtcSignal
      description: 原样转发 SDP 至 go2rtc（FR-106、D-02）；媒体流由 go2rtc 8555 直达浏览器（C-OPS-05）
      x-min-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/sdp:
            schema: { type: string, description: SDP offer }
      responses:
        "200":
          description: SDP answer
          content:
            application/sdp:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/incidents:
    get:
      operationId: listIncidents
      x-min-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Before" }
      responses:
        "200":
          description: 按 created_at 倒序（FR-303）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/incidents/{id}:
    get:
      operationId: getIncident
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 关联事件详情
          content:
            application/json:
              schema: { $ref: "../events/incident.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/incidents/{id}/confirm-containment:
    post:
      operationId: confirmContainment
      description: |
        确认处置（FR-407）：只对 requires_confirmation 为 true 的关联事件有效，否则返回 400。
        发布 hyd.correlator.confirmation.v1 并写审计日志；处置参数仍只取关联事件的结构化字段（G-03）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "202": { description: 已受理，执行器收到确认后执行 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/alerts/{id}/disposition:
    post:
      operationId: disposeAlert
      description: |
        告警处置：值班员对单条告警（行为事件、轨迹规则事件或网络告警）标记已确认、误报或已处理，写审计日志，
        经 WS dispositions 频道推送给所有控制台。误报与已处理会解除该摄像头的物理告警态（行为与规则事件）；
        已确认只停止响铃与弹窗。告警须在近 24 小时的记录中，否则 404
      x-min-role: operator
      parameters:
        - name: id
          in: path
          required: true
          description: 告警的 event_id
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertDispositionRequest" }
      responses:
        "200":
          description: 处置记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDisposition" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/alerts/clear:
    post:
      operationId: clearAlerts
      description: |
        删除告警：把所列告警与关联事件从所有控制台的告警栏移除，写审计日志，经 WS cleared 频道推送。只是不再列出：
        原始事件、存证、处置执行与审计记录照常保留，服务重启后从审计日志读回近 24 小时的删除记录
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertClearRequest" }
      responses:
        "200":
          description: 删除记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertsCleared" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/alerts/{id}/clip:
    get:
      operationId: getAlertClip
      description: |
        单条摄像头告警前后的录像（MP4），供控制台直接回放：行为事件从开始前 10 s 到确认后 10 s，区域与越线从发生前 10 s 起，
        不超过 45 秒、截止于 2 s 前。经 evidence-service 向 recorder 取，不落盘、不写审计；viewer 本就可观看同一路实时画面
      x-min-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          description: 告警的 event_id
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 录像片段
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: 存证或录像服务暂不可达
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/incidents/{id}/investigation:
    get:
      operationId: getInvestigation
      description: AI 安全值班员的调查记录（FR-1102）；尚未开始调查时返回 404
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 调查记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Investigation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/incidents/{id}/reports:
    post:
      operationId: createReport
      description: 同步生成；全部供应商不可用时 3 s 内返回模板报告（FR-501、FR-502）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "201":
          description: 报告已生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      operationId: listReports
      description: 该关联事件的全部报告，按生成时间倒序；报告长期保存，不受 24 小时历史限制（TK-071）
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 报告列表，没有报告时为空
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/reports/{id}:
    get:
      operationId: getReport
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 报告
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/reports/{id}/review:
    post:
      operationId: reviewReport
      description: 记录当前用户与时间，写入审计日志（FR-504）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: 已复核
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/reports/{id}/export:
    get:
      operationId: exportReport
      description: 导出报告文件；未复核时带"未复核草稿"水印（FR-504、V-AI4、D-078）
      x-min-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: format
          in: query
          required: true
          description: html 为自带样式的单个网页（inline，可打印为 PDF）；md 为 Markdown 附件
          schema: { enum: [html, md] }
      responses:
        "200":
          description: 报告文件
          headers:
            Content-Disposition:
              description: html 为 inline，md 为 attachment；文件名 report-<id>.html 或 .md
              schema: { type: string }
          content:
            text/html: { schema: { type: string } }
            text/markdown: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/executions/{id}/rollback:
    post:
      operationId: rollbackExecution
      description: 立即手动回滚（FR-405）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: 已受理：返回当前执行状态；回滚由 playbook-executor 执行，结果经 WS executions 频道推送
          content:
            application/json:
              schema: { $ref: "../events/playbook_execution.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 执行不处于已生效状态，无需回滚
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: 处置执行器暂不可达（回滚请求的流尚未创建），请稍后重试
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/incidents/{id}/evidence/export:
    post:
      operationId: exportEvidence
      description: 写入审计日志（FR-702）；zip，包内格式见存证设计（TK-080）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: 证据包文件
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: 存证服务暂不可达，请稍后重试
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/llm/providers:
    get:
      operationId: listProviders
      description: 按 order 升序，即故障转移顺序（FR-603）
      x-min-role: admin
      responses:
        "200":
          description: 供应商列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProviderList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createProvider
      description: 公网供应商新增后为停用状态（G-02、FR-604）；变更写入审计日志
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProviderCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/llm/providers/{id}:
    patch:
      operationId: updateProvider
      description: 启用公网供应商前由前端弹出确认；全局禁止公网时不可启用（FR-604）；由内网改为公网时停用，除非同一请求 enabled 为 true
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProviderUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 全局禁止公网供应商时不可启用公网供应商
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteProvider
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "204": { description: 已删除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/llm/providers/{id}/test:
    post:
      operationId: testProvider
      description: 依次检查连通与延迟、模型是否存在、结构化输出能力（FR-602）；结果写入供应商 last_test，探测到的能力写入 structured_output
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: 分项结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PublicBlocked" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/llm/providers/{id}/models:
    get:
      operationId: listProviderModels
      description: 调用供应商 GET /models（V-M6）；供应商出错时 502，消息为"原因；改法"
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PublicBlocked" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/llm/models:
    post:
      operationId: discoverModels
      description: 保存前凭地址与 Key 获取模型列表：新建时先填地址与 Key，再从列表选模型（D-084）；不保存任何内容
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelDiscovery" }
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PublicBlocked" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/llm/providers/order:
    put:
      operationId: reorderProviders
      description: 立即生效并写入审计日志（FR-603）
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderOrder" }
      responses:
        "204": { description: 已生效 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/llm/status:
    get:
      operationId: getLlmStatus
      description: 顶栏模型状态（FR-606、V-M8），以最近一次调用为准
      x-min-role: viewer
      responses:
        "200":
          description: 当前状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/kpis:
    get:
      operationId: getKpis
      description: 大屏关键指标（ui.md §4、D-100），按边缘主机时钟计算
      x-min-role: viewer
      parameters:
        - name: day_start
          in: query
          required: true
          description: 浏览器本地当天 0 点，须带时区；"今日已处置"由此起算
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 当前指标
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kpis" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/llm/settings:
    get:
      operationId: getLlmSettings
      x-min-role: admin
      responses:
        "200":
          description: 当前设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateLlmSettings
      description: block_public 开启时所有公网供应商强制停用（FR-604）
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmSettings" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/egress/stats:
    get:
      operationId: getEgressStats
      x-min-role: viewer
      responses:
        "200":
          description: 近 10 分钟发往非私有地址的连接（FR-801）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/audit-logs:
    get:
      operationId: listAuditLogs
      x-min-role: auditor
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Before" }
      responses:
        "200":
          description: 按 ts 倒序（G-13）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: hyd_session }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      description: 全链路透传至审计日志与事件（C-BE-08）
      schema: { type: string, minLength: 1 }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Before:
      name: before
      in: query
      description: 只返回该时间之前的记录
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: 缺少 X-Request-ID 或参数不合法
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: 未登录或会话失效
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: 角色不足
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: 资源不存在
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PublicBlocked:
      description: 已开启全局禁止公网供应商，不向公网地址发送任何请求（D-085）
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadGateway:
      description: 依赖的内部服务不可用或超时（如 go2rtc、llm-gateway），或模型供应商返回错误
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CalibrationAreaChanged:
      description: 摄像头未放入区域，或已不在 area_id 所指的区域（标定期间在场景页被移动）
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CalibrationUnavailable:
      description: 识别服务（vision-engine）5 s 内未应答，或应答不合契约
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
    Role: { enum: [viewer, operator, admin, auditor] }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    Session:
      type: object
      required: [username, role, expires_at]
      properties:
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
    LoginResponse:
      type: object
      required: [role, expires_at]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
    Site:
      type: object
      required: [id, name, width_m, height_m, areas, devices]
      properties:
        id: { type: string }
        name: { type: string }
        width_m: { type: number, exclusiveMinimum: 0 }
        height_m: { type: number, exclusiveMinimum: 0 }
        areas: { type: array, items: { $ref: "#/components/schemas/SceneArea" } }
        devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
    SceneItem:
      type: object
      description: 区域内放置的一个成品模型（FR-908）
      required: [asset, x, y, rot, len]
      properties:
        asset: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", description: 资产目录中的编号 }
        x: { type: number, minimum: 0, maximum: 500, description: 米，俯视时区域左上角为原点、x 向右、y 向下，按网格吸附 }
        y: { type: number, minimum: 0, maximum: 500 }
        rot: { enum: [0, 90, 180, 270], description: 旋转角（度） }
        len:
          anyOf: [{ type: integer, minimum: 1, maximum: 500 }, { type: "null" }]
          description: 线状资产（墙、围栏、道路）的长度，单位格；其余为 null
    SceneArea:
      type: object
      description: 场景区域（D-124）：一张独立的搭建式场景，摄像头的 pose.x、pose.y 为区域内坐标
      required: [id, name, width_m, depth_m, items, updated_at]
      properties:
        id: { type: string, description: area-NN，只增不复用 }
        name: { type: string }
        width_m: { type: integer, minimum: 1, maximum: 500 }
        depth_m: { type: integer, minimum: 1, maximum: 500 }
        items: { type: array, items: { $ref: "#/components/schemas/SceneItem" } }
        updated_at: { type: string, format: date-time, description: 保存时原样带回，用于防并发覆盖 }
    SceneAreaList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SceneArea" } }
    SceneAreaCreate:
      type: object
      required: [name, width_m, depth_m]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        width_m: { type: integer, minimum: 1, maximum: 500 }
        depth_m: { type: integer, minimum: 1, maximum: 500 }
    CameraPlacement:
      type: object
      description: 摄像头在区域内的位置与朝向；安装高度、俯角、视场角在摄像头页编辑
      required: [id, x, y, yaw_deg]
      properties:
        id: { type: string }
        x: { type: number, minimum: 0, maximum: 500 }
        y: { type: number, minimum: 0, maximum: 500 }
        yaw_deg: { type: number, minimum: 0, exclusiveMaximum: 360 }
    SceneAreaUpdate:
      type: object
      required: [name, width_m, depth_m, items, cameras, updated_at]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        width_m: { type: integer, minimum: 1, maximum: 500 }
        depth_m: { type: integer, minimum: 1, maximum: 500 }
        items: { type: array, maxItems: 2000, items: { $ref: "#/components/schemas/SceneItem" } }
        cameras: { type: array, items: { $ref: "#/components/schemas/CameraPlacement" } }
        updated_at: { type: string, format: date-time, description: 读取时的 updated_at }
    SceneAreaFrames:
      type: object
      required: [frames, unavailable, stale]
      properties:
        frames:
          type: array
          items: { $ref: "#/components/schemas/VisionScene" }
          description: 区域内各摄像头当前画面的识别帧，坐标为区域内坐标，按摄像头编号排列
        unavailable:
          type: array
          items: { $ref: "../events/hyd.vision.scene_reply.v1.schema.json#/$defs/SceneUnavailable" }
          description: 区域内没有识别帧的摄像头与原因，按摄像头编号排列
        stale:
          type: array
          items: { type: string }
          deprecated: true
          description: unavailable 中的摄像头编号；下次升契约主版本时删除
    Device:
      type: object
      required: [id, name, type, ip, mode, state, alert_severity, camera]
      properties:
        id: { type: string }
        name: { type: string, description: 显示名称（摄像头登记表的 name） }
        type: { enum: [camera, nvr, switch] }
        ip:
          anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }]
        mode: { enum: [bypass, host_probe] }
        state:
          description: ui.md §5.1，由 api-server 计算
          enum:
            - normal
            - offline
            - uncalibrated
            - physical_alert
            - cyber_alert
            - both
            - pending_action
            - contained
            - notify_only
        alert_severity:
          description: state 为 cyber_alert 或 both 期间收到的最高告警等级，其余状态为 null（ui.md §5.1、V-A1）
          anyOf: [{ enum: [critical, high, medium, low] }, { type: "null" }]
        camera:
          anyOf: [{ $ref: "#/components/schemas/CameraInfo" }, { type: "null" }]
          description: type 为 camera 时必有
    CameraSource:
      type: object
      description: 拉流地址的组成部分，不含凭据；地址由 api-server 拼出，不接受完整地址（D-103）
      required: [protocol, host, port, path]
      properties:
        protocol: { enum: [rtsp, rtmp, http, onvif] }
        host: { type: string, pattern: "^[A-Za-z0-9.:\\[\\]-]{1,253}$", description: 主机名或 IP }
        port: { type: integer, minimum: 1, maximum: 65535 }
        path:
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*$"
          description: "流路径，可含查询串；不含空白与 #（# 在 go2rtc 源中表示参数）"
        relay:
          type: boolean
          default: false
          description: 兼容模式：经 MediaMTX（ingest）中继拉流，只对 rtsp / rtmp 有效（D-117）
    ClimbLine:
      type: array
      description: 禁止攀爬警戒线 [u1, v1, u2, v2]，画面像素坐标（FR-104）；不能是竖直线段
      items: { type: number }
      minItems: 4
      maxItems: 4
    CameraRule: { $ref: "../events/camera_rule.schema.json" }
    Camera:
      type: object
      required: [id, name, ip, ingest, source, device, file_name, username, password_set, area_id, pose, calibration, calibration_error_m, climb_lines, rules, created_at, updated_at]
      properties:
        id: { type: string, description: cam-NN，也是 go2rtc 与录像中的流名 }
        area_id: { anyOf: [{ type: string }, { type: "null" }], description: 所在场景区域；null 表示未放入任何区域，3D 中不出现（D-124） }
        name: { type: string }
        ip:
          anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }]
        ingest:
          enum: [pull, push, usb, file]
          description: pull 为系统拉流；push 为设备推流到 rtsp://<边缘主机>:8554/<id>；usb 为插在边缘主机上的 USB 摄像头，由 ingest 读取设备；file 为视频文件摄像头（D-145）：ingest 循环播放上传的视频，api-server 或 ingest 重启后失效，不能与其他接入方式互转
        source: { anyOf: [{ $ref: "#/components/schemas/CameraSource" }, { type: "null" }], description: 推流与 USB 时为 null }
        device:
          anyOf: [{ type: string }, { type: "null" }]
          description: USB 摄像头的设备标识（/dev/v4l/by-id 下的名字，拔插后不变）；其余接入方式为 null
        file_name:
          anyOf: [{ type: string }, { type: "null" }]
          description: 视频文件摄像头上传时的原始文件名，只用于显示；其余接入方式为 null
        username: { anyOf: [{ type: string }, { type: "null" }] }
        password_set: { type: boolean, description: 口令只写不读（C-ST-03） }
        push_password:
          anyOf: [{ type: string }, { type: "null" }]
          description: 推流口令（用户名 hyd）：只在新增推流摄像头或改为推流的响应中给出一次，列表中不含（V-CAM2、D-103）
        pose: { $ref: "#/components/schemas/Pose" }
        calibration:
          type: array
          description: 地面标定点 [u, v, x, y]，经标定对话框或 site.yaml 初始导入；少于 4 组时按安装参数估算（D-102）
          items: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        calibration_error_m:
          anyOf: [{ type: number, minimum: 0 }, { type: "null" }]
          description: 保存标定时拟合的均方根重投影误差（米）；未标定或经 site.yaml 导入时为 null
        pose_check:
          anyOf: [{ $ref: "../events/pose_check.schema.json" }, { type: "null" }]
          description: 视觉引擎对安装参数的最新自检结果；已标定、未收到自检或视觉引擎重启后尚未上报时为 null（列表中给出，其余响应不含）
        climb_lines: { type: array, items: { $ref: "#/components/schemas/ClimbLine" } }
        rules: { type: array, items: { $ref: "#/components/schemas/CameraRule" }, description: 轨迹规则（区域入侵、有向越线） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Camera" } }
    CameraCreate:
      type: object
      required: [name, ingest, pose]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        ip:
          anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }]
          description: 设备 IP，拉流与推流时必填；USB 与视频文件摄像头没有网络地址，省略时自动分配本机占位地址 127.0.1.N
        ingest: { enum: [pull, push, usb, file], description: file 为临时的视频文件摄像头（D-145），创建后不能改为其他接入方式 }
        source: { anyOf: [{ $ref: "#/components/schemas/CameraSource" }, { type: "null" }], description: 拉流时必填 }
        device: { $ref: "#/components/schemas/UsbDeviceId" }
        video_file: { $ref: "#/components/schemas/VideoFileId" }
        username: { anyOf: [{ type: string, maxLength: 128 }, { type: "null" }] }
        password: { type: string, format: password, writeOnly: true, maxLength: 128 }
        pose: { $ref: "#/components/schemas/Pose" }
        climb_lines: { type: array, items: { $ref: "#/components/schemas/ClimbLine" } }
        rules: { type: array, items: { $ref: "#/components/schemas/CameraRule" }, maxItems: 32 }
    CameraUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        ip:
          anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }]
        ingest: { enum: [pull, push, usb, file], description: 视频文件摄像头与其他接入方式不能互转（D-145） }
        source: { anyOf: [{ $ref: "#/components/schemas/CameraSource" }, { type: "null" }] }
        device: { $ref: "#/components/schemas/UsbDeviceId" }
        video_file: { $ref: "#/components/schemas/VideoFileId" }
        username: { anyOf: [{ type: string, maxLength: 128 }, { type: "null" }] }
        password: { type: string, format: password, writeOnly: true, maxLength: 128, description: 省略表示不修改 }
        clear_password: { type: boolean }
        pose: { $ref: "#/components/schemas/Pose" }
        climb_lines: { type: array, items: { $ref: "#/components/schemas/ClimbLine" } }
        rules: { type: array, items: { $ref: "#/components/schemas/CameraRule" }, maxItems: 32, description: 省略表示不修改；给出时整体替换 }
    UsbDeviceId:
      type: string
      pattern: "^[A-Za-z0-9._:-]{1,200}$"
      description: USB 摄像头的设备标识：边缘主机 /dev/v4l/by-id 下的名字（拔插后不变），改为 USB 接入时必填
    VideoFileId:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: 上传的视频编号（服务端生成），新增视频文件摄像头时必填，更换视频时给出新编号
    VideoFile:
      type: object
      required: [id, name, size_bytes]
      properties:
        id: { $ref: "#/components/schemas/VideoFileId" }
        name: { type: string, description: 原始文件名（去掉路径部分），只用于显示 }
        size_bytes: { type: integer, minimum: 0 }
    UsbDevice:
      type: object
      required: [device, name, camera_id]
      properties:
        device: { $ref: "#/components/schemas/UsbDeviceId" }
        name: { type: string, description: 便于辨认的设备名 }
        camera_id: { anyOf: [{ type: string }, { type: "null" }], description: 已接入时为对应的摄像头编号 }
    UsbDeviceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/UsbDevice" } }
    CalibrationInput:
      type: object
      required: [area_id, points]
      properties:
        area_id: { type: string, description: 打开标定对话框时摄像头所在区域；与库中不一致时 409 }
        points:
          type: array
          description: 0 或 4～20 组 [u, v, x, y]：画面原始分辨率下的像素坐标与区域内平面坐标（米，俯视时区域左上角为原点、x 向右、y 向下）
          maxItems: 20
          items: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
    CalibrationFit:
      type: object
      required: [reproj_error_m, residuals_m]
      properties:
        reproj_error_m: { type: number, minimum: 0, description: 均方根重投影误差（米） }
        residuals_m: { type: array, items: { type: number, minimum: 0 }, description: 各组偏差（米），与 points 一一对应 }
    CameraInfo:
      type: object
      required: [stream, area_id, pose, calibration, mapping, homography, reproj_error_m]
      properties:
        stream: { type: string, description: go2rtc 流名 }
        area_id: { anyOf: [{ type: string }, { type: "null" }], description: 所在场景区域，null 表示未放置 }
        mapping:
          enum: [calibrated, estimated, none]
          description: 地面映射：calibrated 按 ≥ 4 组标定点；estimated 按安装参数估算（D-102）；none 时 state 为 uncalibrated
        pose: { $ref: "#/components/schemas/Pose" }
        calibration:
          type: array
          description: 标定点 [u, v, x, y]：像素坐标与平面坐标；少于 4 组时按安装参数估算（D-102）
          items: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        homography:
          anyOf:
            - type: array
              minItems: 3
              maxItems: 3
              items: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
            - type: "null"
        reproj_error_m: { anyOf: [{ type: number, minimum: 0 }, { type: "null" }] }
        climb_lines:
          type: array
          default: []
          description: 禁止攀爬警戒线（像素坐标），供监控墙画到画面上
          items: { $ref: "#/components/schemas/ClimbLine" }
        rules:
          type: array
          default: []
          description: 轨迹规则（区域入侵、有向越线，平面坐标），供监控墙按地面映射画到画面上
          items: { $ref: "#/components/schemas/CameraRule" }
    Pose:
      type: object
      required: [x, y, height_m, yaw_deg, pitch_deg, hfov_deg, range_m]
      properties:
        x: { type: number }
        y: { type: number }
        height_m: { type: number, exclusiveMinimum: 0, maximum: 50, description: 安装高度（米） }
        yaw_deg: { type: number, description: 朝向，自平面 +x 转向 +y 计（度；俯视 y 向下时为顺时针） }
        pitch_deg: { type: number, minimum: -90, exclusiveMaximum: 0, description: 俯角，向下为负（度） }
        hfov_deg: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 180, description: 水平视场角（度） }
        range_m: { type: number, exclusiveMinimum: 0, maximum: 200, description: 可视距离（米），只用于画视场锥体 }
    IncidentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "../events/incident.schema.json" } }
    Report:
      type: object
      required: [id, incident_id, facts, ai, investigation, source, provider_id, degraded_reason, reviewed_by, reviewed_at, created_at]
      properties:
        id: { type: string }
        incident_id: { type: string }
        facts: { $ref: "#/components/schemas/ReportFacts" }
        ai:
          # 保留原有的 object 分支、以 allOf 收窄为 ReportAi：只是收窄原先的任意对象，不算新增 anyOf 分支（CI-08）
          anyOf: [{ type: object, allOf: [{ $ref: "#/components/schemas/ReportAi" }] }, { type: "null" }]
          description: AI 区；模板模式下为 null
        investigation:
          anyOf: [{ $ref: "#/components/schemas/ReportInvestigation" }, { type: "null" }]
          description: AI 区引用的值班员判定，模型与模板报告都有（D-089）；生成时调查尚未给出判定为 null
        source: { enum: [llm, template] }
        provider_id: { anyOf: [{ type: string }, { type: "null" }] }
        degraded_reason:
          anyOf: [{ type: string }, { type: "null" }]
          description: 模板报告的原因，如"未启用任何模型供应商"（FR-502、V-AI5）；source 为 llm 时为 null
        reviewed_by: { anyOf: [{ type: string }, { type: "null" }] }
        reviewed_at: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        created_at: { type: string, format: date-time }
    ReportList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Report" } }
    ReportAi:
      type: object
      description: AI 区（V-AI1），与事实区物理分隔；供应商信息为生成时的快照
      required: [content, unverified, provider_name, model, network]
      properties:
        content: { $ref: "../llm/incident_report.v1.schema.json" }
        unverified:
          type: array
          items: { type: string }
          description: 无法在证据或本地知识库中溯源的实体，保留并弱化显示（FR-503、C-LLM-06、V-AI3、D-086）
        provider_name: { type: string }
        model: { type: string }
        network:
          $ref: "#/components/schemas/Network"
          description: public 表示发送前已脱敏（C-LLM-03）
    ReportInvestigation:
      type: object
      description: 生成报告时值班员判定的快照（FR-1106）
      required: [verdict, provider, finished_at]
      properties:
        verdict: { $ref: "../events/investigation_frame.schema.json#/$defs/InvestigationVerdict" }
        provider:
          anyOf:
            - { $ref: "../events/investigation_frame.schema.json#/$defs/InvestigationProvider" }
            - { type: "null" }
        finished_at: { type: string, format: date-time }
    ReportFacts:
      type: object
      description: 事实区，全部来自结构化数据，不经过 LLM（V-AI1）
      required: [incident, devices, timeline, executions]
      properties:
        incident: { $ref: "../events/incident.schema.json" }
        devices:
          type: array
          description: 关联事件涉及的设备，取自站点登记
          items: { $ref: "#/components/schemas/ReportDevice" }
        timeline:
          type: array
          description: 按 hit_path 顺序的命中事件
          items: { $ref: "#/components/schemas/ReportTimelineEntry" }
        executions:
          type: array
          description: 该关联事件的处置执行，各自的最新状态
          items: { $ref: "../events/playbook_execution.schema.json" }
    ReportDevice:
      type: object
      required: [id, type, ip]
      properties:
        id: { type: string }
        type: { enum: [camera, nvr, switch] }
        ip:
          anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }]
    ReportTimelineEntry:
      type: object
      description: kind 与 event 为 null 表示证据缺失：事件已超出 24 小时保留或未收到
      required: [event_id, kind, event]
      properties:
        event_id: { type: string, format: uuid }
        kind: { anyOf: [{ enum: [security_alert, behavior, integrity] }, { type: "null" }] }
        event:
          anyOf:
            - { $ref: "#/components/schemas/SecurityAlert" }
            - { $ref: "#/components/schemas/VisionBehavior" }
            - { $ref: "#/components/schemas/VisionIntegrity" }
            - { type: "null" }
    Preset:
      description: 选择后由前端填入地址模板与默认端口（architecture.md §5）
      enum: [llama_cpp, ollama, lm_studio, vllm, deepseek, bailian, kimi, zhipu, siliconflow, custom]
    Network:
      description: 自动判定：回环、私有网段、链路本地为 internal，其余含所有域名为 public（C-LLM-13）
      enum: [internal, public]
    LlmProvider:
      type: object
      description: 不含 API Key，只返回末 4 位（C-LLM-15）
      required:
        - id
        - name
        - preset
        - base_url
        - api_key_last4
        - model
        - network
        - network_overridden
        - structured_output
        - timeout_s
        - enabled
        - order
        - last_test
        - usage_today
      properties:
        id: { type: string }
        name: { type: string }
        preset: { $ref: "#/components/schemas/Preset" }
        base_url: { type: string, description: OpenAI 兼容 base URL }
        api_key_last4: { anyOf: [{ type: string, maxLength: 4 }, { type: "null" }] }
        model: { type: string }
        network: { $ref: "#/components/schemas/Network" }
        network_overridden: { type: boolean, description: 管理员改判过网络位置 }
        structured_output:
          anyOf: [{ enum: [json_schema, json_object, none] }, { type: "null" }]
          description: 由测试连接探测；未测试时为 null
        timeout_s: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        order: { type: integer, minimum: 0 }
        last_test:
          anyOf: [{ $ref: "#/components/schemas/ProviderTestResult" }, { type: "null" }]
          description: 最近一次测试连接的结果，卡片据此显示健康分档与延迟（D-084）；未测试时为 null
        usage_today: { $ref: "#/components/schemas/ProviderUsage" }
    ProviderUsage:
      type: object
      description: 当日（UTC）实际发出的调用次数与 Token，取自响应 usage 字段（D-084）
      required: [calls, tokens]
      properties:
        calls: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
    LlmProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LlmProvider" } }
    LlmStatus:
      type: object
      description: |
        normal 为第一家已启用供应商生效；failover 为最近一次调用由排在后面的供应商完成；template 为没有已启用的
        供应商或最近一次调用全部失败（V-M8）
      required: [state, provider_name, reason]
      properties:
        state: { enum: [normal, failover, template] }
        provider_name: { anyOf: [{ type: string }, { type: "null" }], description: template 时为 null }
        reason: { anyOf: [{ type: string }, { type: "null" }], description: 模板模式的原因，其余为 null }
    Kpi:
      type: object
      required: [value, delta]
      properties:
        value: { anyOf: [{ type: integer }, { type: "null" }], description: null 为无数据，显示 — }
        delta:
          anyOf: [{ type: integer }, { type: "null" }]
          description: 较 1 小时前的变化（last_contain_ms 为较上一次处置），null 为无可比数据
    Kpis:
      type: object
      description: |
        online_devices：登记设备中当前不是离线的台数；active_alerts：仍在保持期内的告警条数（网络告警 5 分钟、
        行为事件 1 分钟，与设备告警态一致）；contained_today：day_start 起处置通过校验的关联事件数（之后回滚仍计入，
        只通知不计）；last_contain_ms：最近一次通过校验的处置，从其关联事件命中路径中最早事件的时刻到通过校验的毫秒数（D-106）
      required: [online_devices, active_alerts, contained_today, last_contain_ms]
      properties:
        online_devices: { $ref: "#/components/schemas/Kpi" }
        active_alerts: { $ref: "#/components/schemas/Kpi" }
        contained_today: { $ref: "#/components/schemas/Kpi" }
        last_contain_ms: { $ref: "#/components/schemas/Kpi" }
    LlmProviderCreate:
      type: object
      required: [name, preset, base_url, model]
      properties:
        name: { type: string }
        preset: { $ref: "#/components/schemas/Preset" }
        base_url: { type: string }
        api_key: { type: string, format: password, writeOnly: true, description: 本地服务未设 Key 时省略 }
        model: { type: string }
        network: { $ref: "#/components/schemas/Network" }
        timeout_s: { type: integer, minimum: 1, default: 60 }
    LlmProviderUpdate:
      type: object
      properties:
        name: { type: string }
        preset: { $ref: "#/components/schemas/Preset" }
        base_url: { type: string }
        api_key: { type: string, format: password, writeOnly: true }
        model: { type: string }
        network: { $ref: "#/components/schemas/Network" }
        timeout_s: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    ProviderTestResult:
      type: object
      required: [checks, health, tested_at, suggested_base_url, suggested_models]
      properties:
        checks: { type: array, items: { $ref: "#/components/schemas/ProviderCheck" } }
        health:
          enum: [ok, slow, failed]
          description: 连通或模型不通过为 failed；连通延迟超过 3000 ms 为 slow；结构化输出不影响分档（D-084）
        tested_at: { type: string, format: date-time }
        suggested_base_url:
          anyOf: [{ type: string }, { type: "null" }]
          description: 原地址的 /models 返回 404、补上 /v1 后可用时给出，由管理员采用
        suggested_models:
          type: array
          items: { type: string }
          maxItems: 3
          description: 配置的模型不在列表中时，名称最相近的候选
    ProviderCheck:
      type: object
      required: [check, ok, latency_ms, reason, hint]
      properties:
        check: { enum: [connectivity, model, structured_output] }
        ok: { type: boolean }
        latency_ms: { anyOf: [{ type: integer, minimum: 0 }, { type: "null" }] }
        reason: { anyOf: [{ type: string }, { type: "null" }] }
        hint: { anyOf: [{ type: string }, { type: "null" }], description: 白话改法 }
    ModelDiscovery:
      type: object
      required: [base_url]
      properties:
        base_url: { type: string }
        api_key: { type: string, format: password, writeOnly: true }
        timeout_s: { type: integer, minimum: 1, default: 60 }
    ModelList:
      type: object
      required: [models]
      properties:
        models: { type: array, items: { type: string } }
    ProviderOrder:
      type: object
      required: [provider_ids]
      properties:
        provider_ids: { type: array, items: { type: string }, uniqueItems: true }
    LlmSettings:
      type: object
      required: [block_public]
      properties:
        block_public: { type: boolean }
    EgressStats:
      type: object
      required: [window_s, count, targets]
      properties:
        window_s: { const: 600 }
        count: { type: integer, minimum: 0 }
        targets: { type: array, items: { $ref: "#/components/schemas/EgressTarget" } }
    EgressTarget:
      type: object
      required: [ip, count]
      properties:
        ip: { anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }] }
        count: { type: integer, minimum: 1 }
    AuditLog:
      type: object
      description: 追加写，禁止修改与删除
      required: [id, ts, actor, action, target, before, after, request_id]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        before: { anyOf: [{ type: object }, { type: "null" }] }
        after: { anyOf: [{ type: object }, { type: "null" }] }
        request_id: { type: string }
    AuditLogList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
    DispositionAction:
      enum: [acknowledged, false_positive, resolved]
      description: acknowledged 已确认（看到了、正在处理）；false_positive 误报；resolved 已处理关闭
    AlertDispositionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/DispositionAction" }
        note: { type: string, maxLength: 200, description: 处置说明，可选 }
    AlertClearRequest:
      type: object
      additionalProperties: false
      required: [event_ids, incident_ids]
      properties:
        event_ids: { type: array, maxItems: 500, items: { type: string, format: uuid }, description: 告警的 event_id }
        incident_ids: { type: array, maxItems: 100, items: { type: string, maxLength: 64 }, description: 关联事件的 id }
    AlertsCleared:
      type: object
      description: 一次删除；控制台不再列出其中的告警与关联事件
      required: [event_ids, incident_ids, actor, ts]
      properties:
        event_ids: { type: array, items: { type: string, format: uuid } }
        incident_ids: { type: array, items: { type: string } }
        actor: { type: string, description: 删除人用户名 }
        ts: { type: string, format: date-time }
    AlertDisposition:
      type: object
      description: 告警的处置记录；同一告警以最近一次为准
      required: [event_id, action, note, actor, ts]
      properties:
        event_id: { type: string, format: uuid }
        action: { $ref: "#/components/schemas/DispositionAction" }
        note: { anyOf: [{ type: string, maxLength: 200 }, { type: "null" }] }
        actor: { type: string, description: 处置人用户名 }
        ts: { type: string, format: date-time }
    WsFrame:
      type: object
      description: |
        WS /ws 推送帧（FR-102、FR-606）。各频道 data 的格式：
        tracks 为 VisionTrack；devices 为状态或告警等级变化后的完整 Device，连接建立时先推送全部设备；
        alerts 为 VisionBehavior、VisionRule 或 SecurityAlert；incidents 为 Incident；executions 为 PlaybookExecution
        （处置执行状态，FR-405）；ai 为 AiInvestigation（值班员调查流，FR-1102）；site 为 Site（摄像头登记表或场景区域
        变化后整体推送，FR-906、FR-908）；dispositions 为 AlertDisposition（告警处置）；cleared 为 AlertsCleared（删除告警）；system 为系统消息（如心跳）。
        连接建立时另补推近 24 小时的 alerts（最多 200 条）、incidents（最多 50 条）、executions（最多 50 个执行
        各自的最新状态）、dispositions（各告警最近一次处置）与 cleared（删除记录），按发生先后排列（D-077）
      required: [channel, data]
      properties:
        channel: { enum: [tracks, devices, alerts, incidents, executions, ai, site, dispositions, cleared, system] }
        data: { type: object }
    AiInvestigation: { $ref: "../events/hyd.ai.investigation.v1.schema.json" }
    Investigation:
      type: object
      description: AI 安全值班员调查记录（architecture.md §12 AiInvestigation）；verdict 为 null 表示进行中或失败
      required: [incident_id, steps, verdict, error, provider, started_at, finished_at]
      properties:
        incident_id: { type: string }
        steps:
          type: array
          items: { $ref: "../events/investigation_frame.schema.json#/$defs/InvestigationStep" }
        verdict:
          anyOf:
            - { $ref: "../events/investigation_frame.schema.json#/$defs/InvestigationVerdict" }
            - { type: "null" }
        error: { anyOf: [{ type: string }, { type: "null" }], description: 失败原因，如"无可用供应商" }
        provider:
          anyOf:
            - { $ref: "../events/investigation_frame.schema.json#/$defs/InvestigationProvider" }
            - { type: "null" }
        started_at: { type: string, format: date-time }
        finished_at: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    VisionTrack: { $ref: "../events/hyd.vision.track.v1.schema.json" }
    VisionScene: { $ref: "../events/hyd.vision.scene.v1.schema.json" }
    VisionBehavior: { $ref: "../events/hyd.vision.behavior.v1.schema.json" }
    VisionRule: { $ref: "../events/hyd.vision.rule.v1.schema.json" }
    SecurityAlert: { $ref: "../events/hyd.security.alert.v1.schema.json" }
    VisionIntegrity: { $ref: "../events/hyd.vision.integrity.v1.schema.json" }
