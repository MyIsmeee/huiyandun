# api-server 对外接口（HYD-PLAN-007 §3、C-BE-01）
# 主版本编码在文件名中；破坏性变更须新建 api-server.v4.yaml（CI-08）
# v3：PlaybookExecution 增加只通知、跳过、过期状态（TK-050），回滚接口的返回取值增加
# x-min-role：最低角色（C-BE-07）；写操作要求 X-Request-ID（C-BE-08）
# 会话凭证只经 HttpOnly Cookie 传递，浏览器脚本不可读（C-FE-06、DP-12）
openapi: 3.1.0
info:
  title: 慧眼盾 api-server
  version: 3.0.0
security:
  - session: []

paths:
  /api/auth/login:
    post:
      operationId: login
      security: []
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: hyd_session=<会话令牌>; HttpOnly; Secure; SameSite=Strict; Path=/
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/logout:
    post:
      operationId: logout
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "204": { description: 会话已失效，Cookie 已清除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/session:
    get:
      operationId: getSession
      description: 当前会话的账户与角色：页面刷新后据此决定渲染哪些操作（C-FE-07）
      x-min-role: viewer
      responses:
        "200":
          description: 会话有效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/site:
    get:
      operationId: getSite
      x-min-role: viewer
      responses:
        "200":
          description: 平面图、区域、设备、标定状态（FR-901）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/devices/{id}:
    get:
      operationId: getDevice
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 设备详情（FR-203）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/devices/{id}/webrtc:
    post:
      operationId: webrtcSignal
      description: 原样转发 SDP 至 go2rtc（FR-106、D-02）；媒体流由 go2rtc 8555 直达浏览器（C-OPS-05）
      x-min-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/sdp:
            schema: { type: string, description: SDP offer }
      responses:
        "200":
          description: SDP answer
          content:
            application/sdp:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/incidents:
    get:
      operationId: listIncidents
      x-min-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Before" }
      responses:
        "200":
          description: 按 created_at 倒序（FR-303）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/incidents/{id}:
    get:
      operationId: getIncident
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 关联事件详情
          content:
            application/json:
              schema: { $ref: "../events/incident.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/incidents/{id}/confirm-containment:
    post:
      operationId: confirmContainment
      description: |
        确认处置（FR-407）：只对 requires_confirmation 为 true 的关联事件有效，否则返回 400。
        发布 hyd.correlator.confirmation.v1 并写审计日志；处置参数仍只取关联事件的结构化字段（G-03）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "202": { description: 已受理，执行器收到确认后执行 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/incidents/{id}/investigation:
    get:
      operationId: getInvestigation
      description: AI 安全值班员的调查记录（FR-1102）；尚未开始调查时返回 404
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 调查记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Investigation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/incidents/{id}/reports:
    post:
      operationId: createReport
      description: 同步生成；全部供应商不可用时 3 s 内返回模板报告（FR-501、FR-502）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "201":
          description: 报告已生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/reports/{id}:
    get:
      operationId: getReport
      x-min-role: viewer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 报告
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/reports/{id}/review:
    post:
      operationId: reviewReport
      description: 记录当前用户与时间，写入审计日志（FR-504）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: 已复核
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/reports/{id}/export:
    get:
      operationId: exportReport
      description: 导出报告文件；未复核时带"未复核草稿"水印（FR-504、V-AI4、D-078）
      x-min-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: format
          in: query
          required: true
          description: html 为自带样式的单个网页（inline，可打印为 PDF）；md 为 Markdown 附件
          schema: { enum: [html, md] }
      responses:
        "200":
          description: 报告文件
          headers:
            Content-Disposition:
              description: html 为 inline，md 为 attachment；文件名 report-<id>.html 或 .md
              schema: { type: string }
          content:
            text/html: { schema: { type: string } }
            text/markdown: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/executions/{id}/rollback:
    post:
      operationId: rollbackExecution
      description: 立即手动回滚（FR-405）
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: 已受理：返回当前执行状态；回滚由 playbook-executor 执行，结果经 WS executions 频道推送
          content:
            application/json:
              schema: { $ref: "../events/playbook_execution.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 执行不处于已生效状态，无需回滚
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: 处置执行器暂不可达（回滚请求的流尚未创建），请稍后重试
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/incidents/{id}/evidence/export:
    post:
      operationId: exportEvidence
      description: 写入审计日志（FR-702）；包内格式由存证任务定义
      x-min-role: operator
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: 证据包文件
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/llm/providers:
    get:
      operationId: listProviders
      description: 按 order 升序，即故障转移顺序（FR-603）
      x-min-role: admin
      responses:
        "200":
          description: 供应商列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProviderList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createProvider
      description: 公网供应商新增后为停用状态（G-02、FR-604）；变更写入审计日志
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProviderCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/llm/providers/{id}:
    patch:
      operationId: updateProvider
      description: 启用公网供应商前由前端弹出确认；全局禁止公网时不可启用（FR-604）；由内网改为公网时停用，除非同一请求 enabled 为 true
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProviderUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 全局禁止公网供应商时不可启用公网供应商
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteProvider
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "204": { description: 已删除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/llm/providers/{id}/test:
    post:
      operationId: testProvider
      description: 依次检查连通与延迟、模型是否存在、结构化输出能力（FR-602）；结果写入供应商 last_test，探测到的能力写入 structured_output
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: 分项结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PublicBlocked" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/llm/providers/{id}/models:
    get:
      operationId: listProviderModels
      description: 调用供应商 GET /models（V-M6）；供应商出错时 502，消息为"原因；改法"
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PublicBlocked" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/llm/models:
    post:
      operationId: discoverModels
      description: 保存前凭地址与 Key 获取模型列表：新建时先填地址与 Key，再从列表选模型（D-084）；不保存任何内容
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelDiscovery" }
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PublicBlocked" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/llm/providers/order:
    put:
      operationId: reorderProviders
      description: 立即生效并写入审计日志（FR-603）
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderOrder" }
      responses:
        "204": { description: 已生效 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/llm/settings:
    get:
      operationId: getLlmSettings
      x-min-role: admin
      responses:
        "200":
          description: 当前设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateLlmSettings
      description: block_public 开启时所有公网供应商强制停用（FR-604）
      x-min-role: admin
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmSettings" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/egress/stats:
    get:
      operationId: getEgressStats
      x-min-role: viewer
      responses:
        "200":
          description: 近 10 分钟发往非私有地址的连接（FR-801）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/audit-logs:
    get:
      operationId: listAuditLogs
      x-min-role: auditor
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Before" }
      responses:
        "200":
          description: 按 ts 倒序（G-13）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: hyd_session }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      description: 全链路透传至审计日志与事件（C-BE-08）
      schema: { type: string, minLength: 1 }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Before:
      name: before
      in: query
      description: 只返回该时间之前的记录
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: 缺少 X-Request-ID 或参数不合法
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: 未登录或会话失效
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: 角色不足
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: 资源不存在
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PublicBlocked:
      description: 已开启全局禁止公网供应商，不向公网地址发送任何请求（D-085）
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadGateway:
      description: 依赖的内部服务不可用或超时（如 go2rtc、llm-gateway），或模型供应商返回错误
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
    Role: { enum: [viewer, operator, admin, auditor] }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    Session:
      type: object
      required: [username, role, expires_at]
      properties:
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
    LoginResponse:
      type: object
      required: [role, expires_at]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
    Site:
      type: object
      required: [id, name, width_m, height_m, walls, doors, zones, devices]
      properties:
        id: { type: string }
        name: { type: string }
        width_m: { type: number, exclusiveMinimum: 0 }
        height_m: { type: number, exclusiveMinimum: 0 }
        walls:
          type: array
          description: 线段 [x1, y1, x2, y2]，单位米
          items: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        doors:
          type: array
          description: 门洞线段 [x1, y1, x2, y2]，单位米，位于某段墙体上
          items: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        zones: { type: array, items: { $ref: "#/components/schemas/Zone" } }
        devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
    Zone:
      type: object
      required: [id, name, polygon, no_climb]
      properties:
        id: { type: string }
        name: { type: string }
        polygon:
          type: array
          minItems: 3
          items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        no_climb: { type: boolean }
    Device:
      type: object
      required: [id, type, ip, mode, state, alert_severity, camera]
      properties:
        id: { type: string }
        type: { enum: [camera, nvr, switch] }
        ip:
          anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }]
        mode: { enum: [bypass, host_probe] }
        state:
          description: HYD-UIX-004 §5.2，由 api-server 计算
          enum:
            - normal
            - offline
            - uncalibrated
            - physical_alert
            - cyber_alert
            - both
            - pending_action
            - contained
            - notify_only
        alert_severity:
          description: state 为 cyber_alert 或 both 期间收到的最高告警等级，其余状态为 null（HYD-UIX-004 §5.2、V-A1）
          anyOf: [{ enum: [critical, high, medium, low] }, { type: "null" }]
        camera:
          anyOf: [{ $ref: "#/components/schemas/CameraInfo" }, { type: "null" }]
          description: type 为 camera 时必有
    CameraInfo:
      type: object
      required: [stream, pose, calibration, homography, reproj_error_m]
      properties:
        stream: { type: string, description: go2rtc 流名 }
        pose: { $ref: "#/components/schemas/Pose" }
        calibration:
          type: array
          description: 标定点 [u, v, x, y]：像素坐标与平面坐标；少于 4 组时 state 为 uncalibrated
          items: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        homography:
          anyOf:
            - type: array
              minItems: 3
              maxItems: 3
              items: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
            - type: "null"
        reproj_error_m: { anyOf: [{ type: number, minimum: 0 }, { type: "null" }] }
    Pose:
      type: object
      required: [x, y, height_m, yaw_deg, pitch_deg, hfov_deg, range_m]
      properties:
        x: { type: number }
        y: { type: number }
        height_m: { type: number }
        yaw_deg: { type: number }
        pitch_deg: { type: number }
        hfov_deg: { type: number }
        range_m: { type: number }
    IncidentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "../events/incident.schema.json" } }
    Report:
      type: object
      required: [id, incident_id, facts, ai, source, provider_id, degraded_reason, reviewed_by, reviewed_at, created_at]
      properties:
        id: { type: string }
        incident_id: { type: string }
        facts: { $ref: "#/components/schemas/ReportFacts" }
        ai:
          # 保留原有的 object 分支、以 allOf 收窄为 ReportAi：只是收窄原先的任意对象，不算新增 anyOf 分支（CI-08）
          anyOf: [{ type: object, allOf: [{ $ref: "#/components/schemas/ReportAi" }] }, { type: "null" }]
          description: AI 区；模板模式下为 null
        source: { enum: [llm, template] }
        provider_id: { anyOf: [{ type: string }, { type: "null" }] }
        degraded_reason:
          anyOf: [{ type: string }, { type: "null" }]
          description: 模板报告的原因，如"未启用任何模型供应商"（FR-502、V-AI5）；source 为 llm 时为 null
        reviewed_by: { anyOf: [{ type: string }, { type: "null" }] }
        reviewed_at: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        created_at: { type: string, format: date-time }
    ReportAi:
      type: object
      description: AI 区（V-AI1），与事实区物理分隔；供应商信息为生成时的快照
      required: [content, unverified, provider_name, model, network]
      properties:
        content: { $ref: "../llm/incident_report.v1.schema.json" }
        unverified:
          type: array
          items: { type: string }
          description: 无法在证据或本地知识库中溯源的实体，保留并弱化显示（FR-503、C-LLM-06、V-AI3、D-086）
        provider_name: { type: string }
        model: { type: string }
        network:
          $ref: "#/components/schemas/Network"
          description: public 表示发送前已脱敏（C-LLM-03）
    ReportFacts:
      type: object
      description: 事实区，全部来自结构化数据，不经过 LLM（V-AI1）
      required: [incident, devices, timeline, executions]
      properties:
        incident: { $ref: "../events/incident.schema.json" }
        devices:
          type: array
          description: 关联事件涉及的设备，取自站点登记
          items: { $ref: "#/components/schemas/ReportDevice" }
        timeline:
          type: array
          description: 按 hit_path 顺序的命中事件
          items: { $ref: "#/components/schemas/ReportTimelineEntry" }
        executions:
          type: array
          description: 该关联事件的处置执行，各自的最新状态
          items: { $ref: "../events/playbook_execution.schema.json" }
    ReportDevice:
      type: object
      required: [id, type, ip]
      properties:
        id: { type: string }
        type: { enum: [camera, nvr, switch] }
        ip:
          anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }]
    ReportTimelineEntry:
      type: object
      description: kind 与 event 为 null 表示证据缺失：事件已超出 24 小时保留或未收到
      required: [event_id, kind, event]
      properties:
        event_id: { type: string, format: uuid }
        kind: { anyOf: [{ enum: [security_alert, behavior, integrity] }, { type: "null" }] }
        event:
          anyOf:
            - { $ref: "#/components/schemas/SecurityAlert" }
            - { $ref: "#/components/schemas/VisionBehavior" }
            - { $ref: "#/components/schemas/VisionIntegrity" }
            - { type: "null" }
    Preset:
      description: 选择后由前端填入地址模板与默认端口（HYD-ARCH-001 §5.3）
      enum: [llama_cpp, ollama, lm_studio, vllm, deepseek, bailian, kimi, zhipu, siliconflow, custom]
    Network:
      description: 自动判定：回环、私有网段、链路本地为 internal，其余含所有域名为 public（C-LLM-13）
      enum: [internal, public]
    LlmProvider:
      type: object
      description: 不含 API Key，只返回末 4 位（C-LLM-15）
      required:
        - id
        - name
        - preset
        - base_url
        - api_key_last4
        - model
        - network
        - network_overridden
        - structured_output
        - timeout_s
        - enabled
        - order
        - last_test
        - usage_today
      properties:
        id: { type: string }
        name: { type: string }
        preset: { $ref: "#/components/schemas/Preset" }
        base_url: { type: string, description: OpenAI 兼容 base URL }
        api_key_last4: { anyOf: [{ type: string, maxLength: 4 }, { type: "null" }] }
        model: { type: string }
        network: { $ref: "#/components/schemas/Network" }
        network_overridden: { type: boolean, description: 管理员改判过网络位置 }
        structured_output:
          anyOf: [{ enum: [json_schema, json_object, none] }, { type: "null" }]
          description: 由测试连接探测；未测试时为 null
        timeout_s: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        order: { type: integer, minimum: 0 }
        last_test:
          anyOf: [{ $ref: "#/components/schemas/ProviderTestResult" }, { type: "null" }]
          description: 最近一次测试连接的结果，卡片据此显示健康分档与延迟（D-084）；未测试时为 null
        usage_today: { $ref: "#/components/schemas/ProviderUsage" }
    ProviderUsage:
      type: object
      description: 当日（UTC）实际发出的调用次数与 Token，取自响应 usage 字段（D-084）
      required: [calls, tokens]
      properties:
        calls: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
    LlmProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LlmProvider" } }
    LlmProviderCreate:
      type: object
      required: [name, preset, base_url, model]
      properties:
        name: { type: string }
        preset: { $ref: "#/components/schemas/Preset" }
        base_url: { type: string }
        api_key: { type: string, format: password, writeOnly: true, description: 本地服务未设 Key 时省略 }
        model: { type: string }
        network: { $ref: "#/components/schemas/Network" }
        timeout_s: { type: integer, minimum: 1, default: 60 }
    LlmProviderUpdate:
      type: object
      properties:
        name: { type: string }
        preset: { $ref: "#/components/schemas/Preset" }
        base_url: { type: string }
        api_key: { type: string, format: password, writeOnly: true }
        model: { type: string }
        network: { $ref: "#/components/schemas/Network" }
        timeout_s: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    ProviderTestResult:
      type: object
      required: [checks, health, tested_at, suggested_base_url, suggested_models]
      properties:
        checks: { type: array, items: { $ref: "#/components/schemas/ProviderCheck" } }
        health:
          enum: [ok, slow, failed]
          description: 连通或模型不通过为 failed；连通延迟超过 3000 ms 为 slow；结构化输出不影响分档（D-084）
        tested_at: { type: string, format: date-time }
        suggested_base_url:
          anyOf: [{ type: string }, { type: "null" }]
          description: 原地址的 /models 返回 404、补上 /v1 后可用时给出，由管理员采用
        suggested_models:
          type: array
          items: { type: string }
          maxItems: 3
          description: 配置的模型不在列表中时，名称最相近的候选
    ProviderCheck:
      type: object
      required: [check, ok, latency_ms, reason, hint]
      properties:
        check: { enum: [connectivity, model, structured_output] }
        ok: { type: boolean }
        latency_ms: { anyOf: [{ type: integer, minimum: 0 }, { type: "null" }] }
        reason: { anyOf: [{ type: string }, { type: "null" }] }
        hint: { anyOf: [{ type: string }, { type: "null" }], description: 白话改法 }
    ModelDiscovery:
      type: object
      required: [base_url]
      properties:
        base_url: { type: string }
        api_key: { type: string, format: password, writeOnly: true }
        timeout_s: { type: integer, minimum: 1, default: 60 }
    ModelList:
      type: object
      required: [models]
      properties:
        models: { type: array, items: { type: string } }
    ProviderOrder:
      type: object
      required: [provider_ids]
      properties:
        provider_ids: { type: array, items: { type: string }, uniqueItems: true }
    LlmSettings:
      type: object
      required: [block_public]
      properties:
        block_public: { type: boolean }
    EgressStats:
      type: object
      required: [window_s, count, targets]
      properties:
        window_s: { const: 600 }
        count: { type: integer, minimum: 0 }
        targets: { type: array, items: { $ref: "#/components/schemas/EgressTarget" } }
    EgressTarget:
      type: object
      required: [ip, count]
      properties:
        ip: { anyOf: [{ type: string, format: ipv4 }, { type: string, format: ipv6 }] }
        count: { type: integer, minimum: 1 }
    AuditLog:
      type: object
      description: 追加写，禁止修改与删除
      required: [id, ts, actor, action, target, before, after, request_id]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        before: { anyOf: [{ type: object }, { type: "null" }] }
        after: { anyOf: [{ type: object }, { type: "null" }] }
        request_id: { type: string }
    AuditLogList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
    WsFrame:
      type: object
      description: |
        WS /ws 推送帧（FR-102、FR-606）。各频道 data 的格式：
        tracks 为 VisionTrack；devices 为状态或告警等级变化后的完整 Device，连接建立时先推送全部设备；
        alerts 为 VisionBehavior 或 SecurityAlert；incidents 为 Incident；executions 为 PlaybookExecution
        （处置执行状态，FR-405）；ai 为 AiInvestigation（值班员调查流，FR-1102）；scene 为 VisionScene
        （各摄像头识别的环境，连接建立时先补推各摄像头最新一帧，FR-108）；system 为系统消息（如心跳）。
        连接建立时另补推近 24 小时的 alerts（最多 200 条）、incidents（最多 50 条）、executions（最多 50 个执行
        各自的最新状态），按发生先后排列（D-077）
      required: [channel, data]
      properties:
        channel: { enum: [tracks, devices, alerts, incidents, executions, ai, scene, system] }
        data: { type: object }
    AiInvestigation: { $ref: "../events/hyd.ai.investigation.v1.schema.json" }
    Investigation:
      type: object
      description: AI 安全值班员调查记录（HYD-PLAN-007 §1 AiInvestigation）；verdict 为 null 表示进行中或失败
      required: [incident_id, steps, verdict, error, provider, started_at, finished_at]
      properties:
        incident_id: { type: string }
        steps:
          type: array
          items: { $ref: "../events/investigation_frame.schema.json#/$defs/InvestigationStep" }
        verdict:
          anyOf:
            - { $ref: "../events/investigation_frame.schema.json#/$defs/InvestigationVerdict" }
            - { type: "null" }
        error: { anyOf: [{ type: string }, { type: "null" }], description: 失败原因，如"无可用供应商" }
        provider:
          anyOf:
            - { $ref: "../events/investigation_frame.schema.json#/$defs/InvestigationProvider" }
            - { type: "null" }
        started_at: { type: string, format: date-time }
        finished_at: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    VisionTrack: { $ref: "../events/hyd.vision.track.v1.schema.json" }
    VisionScene: { $ref: "../events/hyd.vision.scene.v1.schema.json" }
    VisionBehavior: { $ref: "../events/hyd.vision.behavior.v1.schema.json" }
    SecurityAlert: { $ref: "../events/hyd.security.alert.v1.schema.json" }
    VisionIntegrity: { $ref: "../events/hyd.vision.integrity.v1.schema.json" }
