# 演示站点（spec.md FR-901）；格式见 contracts/config/site.schema.json
site: { id: demo-office, name: 演示办公区, width_m: 40, height_m: 24, mode: host_probe }  # 演示以主机探针模式运行，处置真实生效（ops.md §4.2）
walls: [[0, 0, 40, 0], [40, 0, 40, 24], [40, 24, 0, 24], [0, 24, 0, 0]]  # 线段 [x1, y1, x2, y2]
doors: [[18, 0, 20, 0], [0, 10, 0, 12]]            # 门洞线段，须位于某段墙体上（FR-904）
zones:
  - { id: z-01, name: 设备间外墙, polygon: [[30, 0], [40, 0], [40, 6], [30, 6]], no_climb: true }
cameras:
  - id: cam-01
    name: 演示画面 1
    ip: 172.30.0.11
    source: { protocol: rtsp, host: mediamtx, port: 8554, path: cam-01 }  # 初始导入登记表（D-101）
    pose: { x: 2, y: 2, height_m: 3, yaw_deg: 45, pitch_deg: -30, hfov_deg: 90, range_m: 15 }  # 无标定点：按安装参数估算（D-102）
  - id: cam-02                                   # 红方命令攻击的摄像头（D-105）
    name: 演示画面 2
    ip: 172.30.0.12
    source: { protocol: rtsp, host: mediamtx, port: 8554, path: cam-02 }
    pose: { x: 38, y: 22, height_m: 3, yaw_deg: 225, pitch_deg: -30, hfov_deg: 90, range_m: 15 }
    climb_lines: [[427, 700, 602, 340]]          # 禁止攀爬警戒线：攀爬素材中院墙的墙顶（FR-104）
whitelist: [172.30.0.0/28]                        # 核心业务地址，不得被处置（C-SEC-03）
