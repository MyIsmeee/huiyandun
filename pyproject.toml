[project]
name = "huiyandun"
version = "0.0.0"
requires-python = "==3.12.*"

[dependency-groups]
dev = [
    "datamodel-code-generator",
    "httpx2",
    "pip-licenses",
    "pre-commit",
    "pre-commit-hooks",
    "pytest",
    "pyyaml",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[tool.pytest.ini_options]
markers = ["ci11: 公网供应商默认状态与网络位置判定，由 CI-11 单独运行（G-02、C-LLM-13）"]

# tools/codegen 的生成参数（R-05）；输入与输出目录由脚本指定
[tool.datamodel-codegen]
output-model-type = "pydantic_v2.BaseModel"
base-class = "py_contracts.base.ContractModel"
# RootModel 不继承 base-class，由自定义模板补上 allow_inf_nan=False
custom-template-dir = "tools/codegen/templates"
target-python-version = "3.12"
disable-timestamp = true
output-datetime-class = "AwareDatetime"
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
enum-field-as-literal = "all"
# 不加时嵌套数组的 minItems / maxItems 会丢失（如标定点 [u, v, x, y]）
field-constraints = true
formatters = ["ruff-format", "ruff-check"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 显式列出规则，不随 ruff 升级改变默认集
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",  # async 路径中的阻塞调用（C-BE-06）
    "DTZ",    # 不带时区的时间（CD-07）
    "S110",   # except Exception: pass（CD-03）
    "TID251", # 禁用 API，见 banned-api
]

# ruff 无法自动识别 libs/*/src 下的工作区包；生成代码还在临时目录中格式化
[tool.ruff.lint.isort]
known-first-party = ["api_server", "audit_service", "py_common", "py_contracts", "vision_engine"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "请求路径全部 async，不使用同步 HTTP 客户端（C-BE-06）"
