[project]
name = "huiyandun"
version = "0.0.0"
requires-python = "==3.12.*"

[dependency-groups]
dev = [
    "datamodel-code-generator",
    "httpx2",
    "import-linter>=2.15,<3",  # CI-06 模块依赖边界（D-01～D-05、C-LLM-01）
    "packaging>=26.3,<27",  # tools/dev/third_party_licenses.py 解析环境标记
    "pip-licenses",
    "pre-commit",
    "pre-commit-hooks",
    "pytest",
    "pyyaml",
    "ruff",
]

[tool.uv]
package = false
# rtmlib 声明的 onnxruntime（CPU 版）与 opencv-python、opencv-contrib-python 会与 vision-engine 的
# onnxruntime-gpu、opencv-python-headless 写入同一模块目录，后装者覆盖前者；在此去掉，模块由后两者提供
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
    "opencv-python; sys_platform == 'never'",
    "opencv-contrib-python; sys_platform == 'never'",
    # supervision 声明但跟踪不需要：PyAV 自带 GPL 的 x264 / x265，不得进程内加载（G-08）；
    # matplotlib 仅用于绘图。去掉后跟踪可用由 services/vision-engine/tests 验证（REUSE-07）
    "av; sys_platform == 'never'",
    "matplotlib; sys_platform == 'never'",
]

[tool.uv.workspace]
members = ["services/*", "libs/*"]

# CI-06（HYD-PROC-002 §4.1）：模块依赖边界，G-03 的机械保障
[tool.importlinter]
root_packages = [
    "api_server",
    "audit_service",
    "correlator",
    "evidence_service",
    "llm_gateway",
    "playbook_executor",
    "privileged_helper",
    "vision_engine",
    "py_common",
    "py_contracts",
    "evidence_verify",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "服务之间只经事件总线或 HTTP 通信，不互相 import（D-01、D-04、D-05）"
type = "independence"
modules = [
    "api_server",
    "audit_service",
    "correlator",
    "evidence_service",
    "llm_gateway",
    "playbook_executor",
    "privileged_helper",
    "vision_engine",
]
# 已有的共享代码：签名指令格式由 privileged-helper 定义、执行器按它签名（D-074）；
# 审计封存与 api-server 共用审计表定义与数据库连接（G-13）
ignore_imports = [
    "playbook_executor.nftables -> privileged_helper.protocol",
    "audit_service.cli -> api_server.config",
    "audit_service.cli -> api_server.db",
    "audit_service.seal -> api_server.audit",
]

[[tool.importlinter.contracts]]
name = "只有 llm-gateway 使用 openai 客户端（C-LLM-01）"
type = "forbidden"
source_modules = [
    "api_server",
    "audit_service",
    "correlator",
    "evidence_service",
    "playbook_executor",
    "privileged_helper",
    "vision_engine",
    "py_common",
    "py_contracts",
    "evidence_verify",
]
forbidden_modules = ["openai"]

[[tool.importlinter.contracts]]
name = "处置链路不引用任何 LLM 客户端（G-03、D-01）"
type = "forbidden"
source_modules = ["playbook_executor", "privileged_helper"]
forbidden_modules = ["openai", "llm_gateway", "httpx2"]

[[tool.importlinter.contracts]]
name = "vision-engine 只发事件，不写业务库（D-03）"
type = "forbidden"
source_modules = ["vision_engine"]
forbidden_modules = ["sqlalchemy", "asyncpg"]

[tool.pytest.ini_options]
markers = ["ci11: 公网供应商默认状态与网络位置判定，由 CI-11 单独运行（G-02、C-LLM-13）"]

# tools/codegen 的生成参数（R-05）；输入与输出目录由脚本指定
[tool.datamodel-codegen]
output-model-type = "pydantic_v2.BaseModel"
base-class = "py_contracts.base.ContractModel"
# RootModel 不继承 base-class，由自定义模板补上 allow_inf_nan=False
custom-template-dir = "tools/codegen/templates"
target-python-version = "3.12"
disable-timestamp = true
output-datetime-class = "AwareDatetime"
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
enum-field-as-literal = "all"
# 不加时嵌套数组的 minItems / maxItems 会丢失（如标定点 [u, v, x, y]）
field-constraints = true
formatters = ["ruff-format", "ruff-check"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 显式列出规则，不随 ruff 升级改变默认集
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",  # async 路径中的阻塞调用（C-BE-06）
    "DTZ",    # 不带时区的时间（CD-07）
    "S110",   # except Exception: pass（CD-03）
    "TID251", # 禁用 API，见 banned-api
]

# ruff 无法自动识别 libs/*/src 下的工作区包；生成代码还在临时目录中格式化
[tool.ruff.lint.isort]
known-first-party = [
    "api_server",
    "audit_service",
    "correlator",
    "evidence_service",
    "evidence_verify",
    "llm_gateway",
    "playbook_executor",
    "privileged_helper",
    "py_common",
    "py_contracts",
    "vision_engine",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "请求路径全部 async，不使用同步 HTTP 客户端（C-BE-06）"
