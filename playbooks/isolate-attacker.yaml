# 封禁攻击源（FR-401、FR-407）：关联事件的攻击源 IP 经 nftables 封禁，到期自动解除
# 1.1：认证爆破（HYD-NET-0101）、推流劫持（HYD-NET-0102）本身即触发，不必等到画面遭篡改；
# 同一攻击源已封禁时后到的关联事件记为跳过（C-BE-04）
id: isolate-attacker
version: 1.1.0
trigger:
  rule_ids: [HYD-NET-0101, HYD-NET-0102, HYD-X-0001]  # 只引用规则引擎输出（C-SEC-02）
  severity: [critical, high]
requires_mode: [host_probe]  # 旁路模式下只通知不执行（FR-1001）
target: incident.source_ip   # 只能引用 Incident 的结构化字段
# incident.requires_confirmation 为 true 时，收到 hyd.correlator.confirmation.v1 后才执行（FR-407）
ttl_s: 1800                  # 30 分钟（FR-404、C-BE-05）；可由 HYD_TTL_OVERRIDE_S 统一覆盖
actions:
  - adapter: nftables
    action: block_ip
    params: { direction: inbound }
on_failure: rollback_and_notify
